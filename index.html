var M = [];

M.push({id:1,title:'Введение в микроэкономику',icon:'fa-compass',short:'Предмет и метод, позитивный и нормативный анализ, альтернативные издержки, КПВ',
lecture:`
<h3><i class="fa-solid fa-1"></i> Предмет и метод микроэкономики</h3>
<p><b>Микроэкономика</b> — раздел экономической теории, изучающий поведение отдельных хозяйствующих субъектов (домохозяйств, фирм, государства как регулятора) и механизмы координации их решений на отдельных рынках. Центральная проблема науки — <em>фундаментальное противоречие</em> между безграничностью потребностей и ограниченностью (редкостью) ресурсов.</p>
<p>Из редкости вытекает необходимость <b>выбора</b>, а всякий выбор экономисты описывают тремя классическими вопросами: <em>ЧТО</em> производить (структура выпуска), <em>КАК</em> производить (технология и комбинация факторов), <em>ДЛЯ КОГО</em> производить (распределение произведённого блага между агентами).</p>
<div class="note"><b>Факторы производства:</b> труд (L, доход — заработная плата w), капитал (K, доход — процент r), земля и природные ресурсы (T, доход — рента), предпринимательская способность (доход — прибыль π), а в современных моделях — информация и человеческий капитал.</div>
<h4>Методологические принципы</h4>
<ul>
<li><b>Методологический индивидуализм</b> — все общественные явления объясняются через решения отдельных рациональных агентов.</li>
<li><b>Предельный (маржинальный) анализ</b> — решение принимается сравнением дополнительной выгоды (MB) и дополнительных издержек (MC) от ещё одной единицы действия. Оптимум: MB = MC.</li>
<li><b>Равновесный подход</b> — поиск состояния, из которого ни одному агенту невыгодно односторонне отклоняться.</li>
<li><b>Принцип «при прочих равных» (ceteris paribus)</b> — изоляция влияния одного фактора при фиксации остальных.</li>
<li><b>Моделирование и абстракция</b> — экономическая модель всегда упрощение, её качество оценивается не реализмом предпосылок, а точностью предсказаний (методологический инструментализм М. Фридмена).</li>
</ul>
<h3><i class="fa-solid fa-2"></i> Позитивный и нормативный анализ</h3>
<p><b>Позитивная микроэкономика</b> отвечает на вопрос «что есть и что будет, если…». Её утверждения в принципе проверяемы данными: «повышение акциза на табак на 10% сократит объём продаж на 4%».</p>
<p><b>Нормативная микроэкономика</b> отвечает на вопрос «как должно быть». Её утверждения содержат оценочные суждения и опираются на критерии справедливости: «государство должно субсидировать проезд студентов».</p>
<div class="note">Проверка на тип утверждения: присутствуют ли слова <em>«следует», «необходимо», «справедливо», «слишком»</em>? Почти наверняка перед вами нормативное суждение. Описывает ли фраза причинно-следственную связь, которую можно опровергнуть статистикой? Это позитивный анализ.</div>
<h3><i class="fa-solid fa-3"></i> Альтернативные издержки (opportunity costs)</h3>
<p><b>Альтернативные издержки</b> — ценность наилучшей из отвергнутых альтернатив использования ресурса. Это центральное понятие всей экономической науки: экономическая стоимость любого решения измеряется не деньгами, а упущенными возможностями.</p>
<div class="fml">OC (выбора A) = выгода наилучшего отвергнутого варианта B</div>
<p>Отсюда различие бухгалтерского и экономического подхода:</p>
<div class="fml">Экономические издержки = явные (бухгалтерские, внешние) + неявные (внутренние, альтернативные)<br>π<sub>эк</sub> = TR − явные − неявные &nbsp;&lt;&nbsp; π<sub>бух</sub> = TR − явные</div>
<p>Нулевая экономическая прибыль означает, что ресурсы приносят ровно столько же, сколько в лучшем альтернативном применении — это состояние <em>нормальной прибыли</em>, и у предпринимателя нет стимулов менять сферу деятельности.</p>
<table class="t"><tr><th>Показатель</th><th>Бухгалтер</th><th>Экономист</th></tr>
<tr><td>Выручка</td><td>1 000 000</td><td>1 000 000</td></tr>
<tr><td>Явные издержки</td><td>700 000</td><td>700 000</td></tr>
<tr><td>Упущенная зарплата</td><td>—</td><td>240 000</td></tr>
<tr><td>Упущенный процент</td><td>—</td><td>60 000</td></tr>
<tr><td><b>Прибыль</b></td><td><b>300 000</b></td><td><b>0</b></td></tr></table>
<p>Важный принцип: <b>невозвратные (утопленные) издержки</b> (sunk costs) не являются альтернативными и не должны влиять на решения. Потраченное безвозвратно нельзя вернуть ни одним из будущих выборов, значит, при сравнении вариантов эти суммы одинаковы и сокращаются.</p>
<h3><i class="fa-solid fa-4"></i> Кривая производственных возможностей (КПВ)</h3>
<p><b>КПВ (PPF, production possibility frontier)</b> — геометрическое место точек, показывающих максимально возможные комбинации выпуска двух благ при полном и эффективном использовании всех ресурсов и данной технологии.</p>
<svg viewBox="0 0 330 200" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="15" x2="40" y2="165" stroke="var(--mu)" stroke-width="1.5"/>
<line x1="40" y1="165" x2="310" y2="165" stroke="var(--mu)" stroke-width="1.5"/>
<path d="M40 25 Q 160 45 270 165" fill="none" stroke="var(--p2)" stroke-width="2.5"/>
<circle cx="105" cy="38" r="4" fill="var(--ac)"/><text x="112" y="36" fill="var(--ac)" font-size="11">A</text>
<circle cx="220" cy="105" r="4" fill="var(--ac)"/><text x="227" y="103" fill="var(--ac)" font-size="11">B</text>
<circle cx="110" cy="120" r="4" fill="#22c55e"/><text x="117" y="124" fill="#22c55e" font-size="11">C (неэффективно)</text>
<circle cx="250" cy="45" r="4" fill="#ef4444"/><text x="200" y="35" fill="#ef4444" font-size="11">D (недостижимо)</text>
<text x="300" y="183" fill="var(--mu)" font-size="11">Товар X</text><text x="6" y="22" fill="var(--mu)" font-size="11">Товар Y</text>
</svg>
<ul>
<li>Точки <b>на кривой</b> (A, B) — эффективные по Парето: нельзя увеличить выпуск одного блага, не сократив другое.</li>
<li>Точки <b>внутри</b> (C) — неэффективное использование ресурсов: безработица, простой мощностей.</li>
<li>Точки <b>вне</b> (D) — недостижимы при текущих ресурсах и технологии.</li>
</ul>
<h4>Наклон КПВ и закон возрастающих альтернативных издержек</h4>
<p>Наклон КПВ по абсолютной величине называется <b>предельной нормой трансформации</b>:</p>
<div class="fml">MRT<sub>XY</sub> = −ΔY / ΔX = MC<sub>X</sub> / MC<sub>Y</sub></div>
<p><b>Закон возрастающих альтернативных издержек:</b> по мере наращивания производства одного блага альтернативные издержки каждой дополнительной его единицы растут. Причина — <em>несовершенная взаимозаменяемость ресурсов</em>: сначала в производство X вовлекаются ресурсы, наиболее приспособленные именно к X, затем приходится перебрасывать всё менее подходящие. Графически закон даёт <b>вогнутую к началу координат</b> КПВ.</p>
<p>Если ресурсы абсолютно взаимозаменяемы (один и тот же труд одинаково производителен в обеих отраслях), КПВ становится <b>прямой линией</b> с постоянными альтернативными издержками — это случай, используемый в теории сравнительных преимуществ Д. Рикардо.</p>
<h4>Сдвиги КПВ</h4>
<p>Экономический рост сдвигает КПВ вправо-вверх. Он может быть <em>равномерным</em> (общее улучшение технологии, рост населения) или <em>асимметричным</em> (технологический прорыв только в одной отрасли — кривая растягивается лишь по одной оси). Выбор между производством инвестиционных и потребительских благ сегодня определяет скорость сдвига КПВ завтра: это классическая иллюстрация межвременного выбора.</p>
<div class="note"><b>Итог темы:</b> редкость ⇒ выбор ⇒ альтернативные издержки ⇒ КПВ как модель выбора ⇒ эффективность, рост и предельный анализ как инструмент оптимального решения.</div>
`,
quiz:[
 {q:'Какое утверждение является нормативным?',a:['Повышение МРОТ на 20% увеличит безработицу среди молодёжи','Государство должно повысить МРОТ ради социальной справедливости','Эластичность спроса на бензин равна −0,3','При росте дохода спрос на мясо увеличился на 7%'],c:1,e:'Нормативные утверждения содержат оценочные суждения («должно», «справедливо») и не проверяются эмпирически.'},
 {q:'Студент бросил работу с зарплатой 60 000 руб./мес и учится платно за 25 000 руб./мес. Каковы его месячные альтернативные издержки обучения?',a:['25 000','60 000','85 000','35 000'],c:2,e:'Альтернативные издержки = явные (плата 25 000) + неявные (упущенная зарплата 60 000) = 85 000 руб.'},
 {q:'Вогнутость КПВ к началу координат объясняется:',a:['Законом спроса','Полной взаимозаменяемостью ресурсов','Законом возрастающих альтернативных издержек','Инфляцией'],c:2,e:'Несовершенная взаимозаменяемость ресурсов ⇒ каждая следующая единица блага обходится дороже в единицах другого блага.'},
 {q:'Точка внутри КПВ означает:',a:['Эффективное использование ресурсов','Недостижимое состояние','Неполное использование ресурсов','Экономический рост'],c:2,e:'Внутренние точки отражают безработицу, простой мощностей, то есть неэффективность по Парето.'},
 {q:'Невозвратные (sunk) издержки при принятии решения:',a:['Должны полностью учитываться','Не должны влиять на выбор','Равны альтернативным издержкам','Всегда равны постоянным издержкам'],c:1,e:'Утопленные издержки одинаковы для всех вариантов и потому не влияют на сравнительный анализ.'}
],
seminar:[
 {type:'num',q:'Экономика располагает 100 часами труда. На производство одной пушки требуется 5 часов, на производство одной тонны масла — 2 часа. Ресурсы абсолютно взаимозаменяемы. Чему равны альтернативные издержки производства одной пушки, выраженные в тоннах масла?',ans:2.5,tol:0.01,unit:'т масла',

M.push({id:2,title:'Рыночный механизм: спрос и предложение',icon:'fa-scale-balanced',short:'Законы D и S, детерминанты, равновесие P* и Q*, излишки потребителя и производителя',
lecture:`
<h3><i class="fa-solid fa-1"></i> Спрос и закон спроса</h3>
<p><b>Спрос (D)</b> — зависимость между ценой блага и количеством, которое покупатели готовы и способны приобрести за определённый период при прочих равных условиях. Важно различать: <em>величина спроса</em> — конкретное число при конкретной цене (движение ВДОЛЬ кривой), <em>спрос</em> — вся функция целиком (сдвиг кривой).</p>
<div class="fml">Q<sup>d</sup> = a − b·P &nbsp;&nbsp;⟺&nbsp;&nbsp; P = a/b − (1/b)·Q<sup>d</sup></div>
<p><b>Закон спроса:</b> при прочих равных снижение цены увеличивает величину спроса. Три объяснения отрицательного наклона:</p>
<ul>
<li><b>Эффект замещения</b> — подешевевшее благо вытесняет относительно подорожавшие субституты;</li>
<li><b>Эффект дохода</b> — снижение цены повышает реальную покупательную способность;</li>
<li><b>Закон убывающей предельной полезности</b> — каждая следующая единица менее ценна, поэтому покупатель готов платить за неё меньше.</li>
</ul>
<h4>Неценовые детерминанты спроса (сдвигают кривую)</h4>
<ul>
<li><b>Доход I:</b> для нормальных благ D↑ при I↑; для инфериорных — наоборот;</li>
<li><b>Цены связанных благ:</b> рост цены субститута сдвигает D вправо, рост цены комплемента — влево;</li>
<li><b>Вкусы и предпочтения, мода, реклама;</b></li>
<li><b>Ожидания</b> будущих цен и доходов;</li>
<li><b>Число покупателей</b> на рынке (переход от индивидуального к рыночному спросу — горизонтальное суммирование).</li>
</ul>
<h3><i class="fa-solid fa-2"></i> Предложение и закон предложения</h3>
<p><b>Предложение (S)</b> — зависимость между ценой и количеством блага, которое производители готовы продать. <b>Закон предложения:</b> при прочих равных рост цены увеличивает величину предложения, поскольку (а) растёт прибыльность, (б) при росте выпуска растут предельные издержки, и только более высокая цена оправдывает дополнительный выпуск.</p>
<div class="fml">Q<sup>s</sup> = −c + d·P</div>
<p>Детерминанты предложения: технология, цены ресурсов (w, r), налоги и субсидии, ожидания производителей, число продавцов, цены альтернативных товаров производства.</p>
<h3><i class="fa-solid fa-3"></i> Рыночное равновесие</h3>
<p><b>Равновесие</b> — состояние рынка, при котором величина спроса равна величине предложения; возникающая при этом цена называется <b>равновесной (P*)</b>, а объём — <b>равновесным (Q*)</b>.</p>
<div class="fml">Q<sup>d</sup>(P*) = Q<sup>s</sup>(P*) ⇒ a − bP = −c + dP ⇒ P* = (a + c)/(b + d)</div>
<svg viewBox="0 0 330 210" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="12" x2="40" y2="175" stroke="var(--mu)" stroke-width="1.5"/>
<line x1="40" y1="175" x2="312" y2="175" stroke="var(--mu)" stroke-width="1.5"/>
<line x1="55" y1="25" x2="285" y2="160" stroke="var(--p2)" stroke-width="2.5"/><text x="288" y="158" fill="var(--p2)" font-size="11">D</text>
<line x1="55" y1="162" x2="285" y2="28" stroke="#22c55e" stroke-width="2.5"/><text x="288" y="30" fill="#22c55e" font-size="11">S</text>
<polygon points="40,32 40,94 170,94" fill="#3b9bff" opacity=".28"/>
<polygon points="40,155 40,94 170,94" fill="#22c55e" opacity=".28"/>
<text x="70" y="62" fill="#9fd0ff" font-size="10">CS</text><text x="70" y="128" fill="#9ff0c0" font-size="10">PS</text>
<circle cx="170" cy="94" r="5" fill="var(--ac)"/><text x="178" y="88" fill="var(--ac)" font-size="11">E (P*, Q*)</text>
<line x1="40" y1="94" x2="170" y2="94" stroke="var(--ac)" stroke-dasharray="3 3"/><line x1="170" y1="94" x2="170" y2="175" stroke="var(--ac)" stroke-dasharray="3 3"/>
<text x="300" y="193" fill="var(--mu)" font-size="11">Q</text><text x="8" y="20" fill="var(--mu)" font-size="11">P</text>
</svg>
<p>Если <b>P &gt; P*</b>, возникает <em>избыток (профицит)</em>: Q<sup>s</sup> &gt; Q<sup>d</sup>, конкуренция продавцов сбивает цену. Если <b>P &lt; P*</b>, возникает <em>дефицит</em>: Q<sup>d</sup> &gt; Q<sup>s</sup>, конкуренция покупателей толкает цену вверх. Так работает «невидимая рука» — механизм автоматической координации.</p>
<h4>Сравнительная статика: четыре базовых случая</h4>
<table class="t"><tr><th>Сдвиг</th><th>P*</th><th>Q*</th></tr>
<tr><td>D вправо (↑)</td><td>↑</td><td>↑</td></tr><tr><td>D влево (↓)</td><td>↓</td><td>↓</td></tr>
<tr><td>S вправо (↑)</td><td>↓</td><td>↑</td></tr><tr><td>S влево (↓)</td><td>↑</td><td>↓</td></tr></table>
<p>При одновременном сдвиге обеих кривых однозначно определяется только одна из двух величин, вторая зависит от относительной силы сдвигов. Например, D↑ и S↑ ⇒ Q* однозначно растёт, а P* неопределённа.</p>
<h3><i class="fa-solid fa-4"></i> Излишки и общественное благосостояние</h3>
<p><b>Излишек потребителя (CS, consumer surplus)</b> — разница между максимальной готовностью платить (резервной ценой) и фактически уплаченной ценой, суммированная по всем купленным единицам. Графически — площадь между кривой спроса и горизонталью цены.</p>
<div class="fml">CS = ½ · (P<sub>max</sub> − P*) · Q* &nbsp;&nbsp; (для линейного спроса)</div>
<p><b>Излишек производителя (PS, producer surplus)</b> — разница между полученной ценой и минимальной приемлемой ценой (предельными издержками), суммированная по всем проданным единицам.</p>
<div class="fml">PS = ½ · (P* − P<sub>min</sub>) · Q* &nbsp;&nbsp;&nbsp; W = CS + PS → max</div>
<p>Ключевой результат вводного курса (<em>первая теорема благосостояния</em> в простейшей форме): на конкурентном рынке без внешних эффектов равновесный объём Q* максимизирует сумму излишков. Любое отклонение от Q* (налог, потолок цены, квота, монопольная власть) порождает <b>чистые потери общества (DWL)</b>.</p>
<div class="note"><b>Практический вывод:</b> равновесие — не просто пересечение линий, а точка, где предельная общественная выгода (высота кривой спроса) равна предельным общественным издержкам (высота кривой предложения).</div>
`,

M.push({id:3,title:'Эластичность',icon:'fa-arrows-left-right',short:'Эластичность спроса по цене и доходу, перекрёстная эластичность, эластичность предложения',
lecture:`
<h3><i class="fa-solid fa-1"></i> Понятие эластичности</h3>
<p><b>Эластичность</b> — мера чувствительности одной переменной к процентному изменению другой. Главное достоинство показателя — он безразмерен и позволяет сравнивать товары, измеряемые в разных единицах (тонны нефти и часы консультаций).</p>
<div class="fml">E = (процентное изменение зависимой переменной) / (процентное изменение независимой переменной)</div>
<h3><i class="fa-solid fa-2"></i> Эластичность спроса по цене</h3>
<p><b>Точечная эластичность</b> измеряется в конкретной точке кривой и использует производную:</p>
<div class="fml">E<sub>p</sub><sup>d</sup> = (dQ/dP) · (P/Q)</div>
<p><b>Дуговая эластичность</b> (формула средней точки, midpoint) применяется при больших дискретных изменениях и не зависит от направления движения по кривой:</p>
<div class="fml">E<sub>арк</sub> = [ΔQ / ((Q₁+Q₂)/2)] / [ΔP / ((P₁+P₂)/2)]</div>
<h4>Классификация по модулю эластичности</h4>
<table class="t"><tr><th>Значение</th><th>Тип спроса</th><th>Пример</th></tr>
<tr><td>|E| = 0</td><td>совершенно неэластичный</td><td>инсулин для диабетика</td></tr>
<tr><td>0 &lt; |E| &lt; 1</td><td>неэластичный</td><td>хлеб, бензин, соль</td></tr>
<tr><td>|E| = 1</td><td>единичная эластичность</td><td>гипербола TR = const</td></tr>
<tr><td>1 &lt; |E| &lt; ∞</td><td>эластичный</td><td>туризм, ювелирные изделия</td></tr>
<tr><td>|E| = ∞</td><td>совершенно эластичный</td><td>продукт фирмы в условиях совершенной конкуренции</td></tr></table>
<h4>Факторы эластичности спроса</h4>
<ul><li>наличие и близость <b>субститутов</b> (главный фактор);</li>
<li>доля расходов на товар <b>в бюджете</b> потребителя;</li>
<li>тип блага: предмет первой необходимости или роскоши;</li>
<li><b>фактор времени</b>: в долгосрочном периоде спрос эластичнее;</li>
<li>степень агрегирования: спрос на «автомобиль Toyota Camry» эластичнее, чем на «автомобили вообще».</li></ul>
<h4>Эластичность и выручка продавца</h4>
<p>Для линейного спроса эластичность меняется вдоль кривой: в верхней половине |E| &gt; 1, в средней точке |E| = 1, в нижней |E| &lt; 1. Именно в средней точке выручка TR = P·Q достигает максимума.</p>
<div class="fml">|E| &gt; 1 ⇒ P↑ ведёт к TR↓ &nbsp;|&nbsp; |E| &lt; 1 ⇒ P↑ ведёт к TR↑ &nbsp;|&nbsp; |E| = 1 ⇒ TR = max</div>
<svg viewBox="0 0 330 185" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="10" x2="40" y2="150" stroke="var(--mu)" stroke-width="1.5"/><line x1="40" y1="150" x2="310" y2="150" stroke="var(--mu)" stroke-width="1.5"/>
<line x1="45" y1="18" x2="285" y2="148" stroke="var(--p2)" stroke-width="2.5"/>
<text x="70" y="40" fill="var(--ac)" font-size="10">|E| &gt; 1 (эластичный)</text>
<circle cx="165" cy="83" r="4.5" fill="var(--ac)"/><text x="173" y="80" fill="var(--ac)" font-size="10">|E| = 1, TR max</text>
<text x="180" y="135" fill="#9fd0ff" font-size="10">|E| &lt; 1 (неэластичный)</text>
<text x="300" y="168" fill="var(--mu)" font-size="11">Q</text><text x="8" y="18" fill="var(--mu)" font-size="11">P</text></svg>
<h3><i class="fa-solid fa-3"></i> Эластичность спроса по доходу</h3>
<div class="fml">E<sub>I</sub> = (ΔQ/Q) / (ΔI/I)</div>
<ul>
<li><b>E<sub>I</sub> &gt; 0</b> — нормальное благо; при этом 0 &lt; E<sub>I</sub> &lt; 1 — предмет первой необходимости (спрос растёт медленнее дохода), E<sub>I</sub> &gt; 1 — предмет роскоши;</li>
<li><b>E<sub>I</sub> &lt; 0</b> — инфериорное (низшее) благо: рост дохода сокращает потребление (дешёвые крупы, подержанная одежда);</li>
<li><b>E<sub>I</sub> = 0</b> — нейтральное благо (соль, спички).</li>
</ul>
<p>Закон Энгеля: с ростом дохода доля расходов на продовольствие снижается — эмпирическая закономерность, подтверждаемая бюджетной статистикой с XIX века.</p>
<h3><i class="fa-solid fa-4"></i> Перекрёстная эластичность</h3>
<div class="fml">E<sub>xy</sub> = (ΔQ<sub>x</sub>/Q<sub>x</sub>) / (ΔP<sub>y</sub>/P<sub>y</sub>)</div>
<ul><li><b>E<sub>xy</sub> &gt; 0</b> — <em>взаимозаменяемые</em> блага (субституты): чай и кофе;</li>
<li><b>E<sub>xy</sub> &lt; 0</b> — <em>взаимодополняемые</em> (комплементы): автомобили и бензин, принтеры и картриджи;</li>
<li><b>E<sub>xy</sub> ≈ 0</b> — независимые блага.</li></ul>
<p>Показатель активно применяется антимонопольными органами для определения <b>границ товарного рынка</b>: если перекрёстная эластичность между продуктами высока, они принадлежат одному рынку.</p>
<h3><i class="fa-solid fa-5"></i> Эластичность предложения</h3>
<div class="fml">E<sub>s</sub> = (dQ<sup>s</sup>/dP) · (P/Q<sup>s</sup>)</div>
<p>Главный фактор — <b>время</b>. А. Маршалл выделял три периода:</p>
<ul><li><b>мгновенный</b>: выпуск фиксирован, E<sub>s</sub> = 0 (вертикальная S);</li>
<li><b>короткий</b>: меняется только переменный фактор, 0 &lt; E<sub>s</sub> &lt; ∞;</li>
<li><b>длительный</b>: меняются все факторы и число фирм, предложение весьма эластично.</li></ul>
<p>Любая линейная функция предложения, проходящая через начало координат, имеет E<sub>s</sub> = 1 в каждой точке; выходящая из оси P — эластична (E<sub>s</sub> &gt; 1); выходящая из оси Q — неэластична.</p>
<div class="note"><b>Применение:</b> распределение налогового бремени определяется соотношением эластичностей — доля потребителя = E<sub>s</sub> / (E<sub>s</sub> + |E<sub>d</sub>|). Чем менее эластична ваша сторона рынка, тем большую часть налога вы заплатите.</div>

M.push({id:4,title:'Государственное вмешательство в рынок',icon:'fa-landmark',short:'Потолки и полы цен, потоварные налоги и акцизы, субсидии, мёртвый груз',
lecture:`
<h3><i class="fa-solid fa-1"></i> Зачем государство вмешивается</h3>
<p>Конкурентный рынок максимизирует сумму излишков, но результат может быть сочтён социально неприемлемым (слишком высокая цена жилья, слишком низкий доход фермеров), а также возникают провалы рынка. Инструменты вмешательства: <b>фиксация цен</b>, <b>налоги</b>, <b>субсидии</b>, квоты, лицензирование. Любой из них смещает рынок с эффективного объёма Q* и порождает чистые потери, если не связан с устранением провала рынка.</p>
<h3><i class="fa-solid fa-2"></i> Потолок цены (price ceiling)</h3>
<p><b>Потолок цены</b> — законодательно установленный максимум. Связывающим (эффективным) он является только если установлен <em>ниже</em> равновесной цены: P<sub>c</sub> &lt; P*.</p>
<p>Последствия: устойчивый <b>дефицит</b> (Q<sup>d</sup> &gt; Q<sup>s</sup>), очереди и нормирование, снижение качества, рост «серого» рынка по ценам выше равновесных, издержки поиска. Выигрыш достаётся тем покупателям, кто смог купить; совокупный излишек сокращается.</p>
<div class="fml">Дефицит = Q<sup>d</sup>(P<sub>c</sub>) − Q<sup>s</sup>(P<sub>c</sub>) &nbsp;&nbsp;|&nbsp;&nbsp; DWL = ½ · (P<sub>d</sub> − P<sub>s</sub>) · (Q* − Q<sub>факт</sub>)</div>
<h3><i class="fa-solid fa-3"></i> Пол цены (price floor)</h3>
<p><b>Пол цены</b> — законодательный минимум; связывающий, если установлен <em>выше</em> равновесия: P<sub>f</sub> &gt; P*. Последствия — устойчивый <b>избыток</b>. Классические примеры: минимальная заработная плата (избыток предложения труда = безработица) и закупочные цены в аграрной политике (приходится скупать излишки в госрезерв).</p>
<h3><i class="fa-solid fa-4"></i> Потоварный налог (акциз)</h3>
<p><b>Потоварный (специфический) налог t</b> взимается в фиксированной сумме с каждой проданной единицы. Фундаментальный результат: <em>юридическое распределение налога (кто платит в бюджет) не влияет на экономическое распределение бремени</em> — оно определяется только эластичностями.</p>
<div class="fml">Налог на продавца: Q<sup>s</sup> = −c + d·(P − t) ⇒ S сдвигается вверх на t<br>Налог на покупателя: Q<sup>d</sup> = a − b·(P + t) ⇒ D сдвигается вниз на t<br>P<sub>d</sub> − P<sub>s</sub> = t в обоих случаях, Q<sub>t</sub> одинаков</div>
<svg viewBox="0 0 330 205" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="10" x2="40" y2="170" stroke="var(--mu)" stroke-width="1.5"/><line x1="40" y1="170" x2="312" y2="170" stroke="var(--mu)" stroke-width="1.5"/>
<line x1="50" y1="22" x2="280" y2="158" stroke="var(--p2)" stroke-width="2.5"/><text x="283" y="156" fill="var(--p2)" font-size="11">D</text>
<line x1="50" y1="160" x2="280" y2="30" stroke="#22c55e" stroke-width="2.5"/><text x="283" y="32" fill="#22c55e" font-size="11">S</text>
<line x1="50" y1="130" x2="280" y2="0" stroke="var(--ac)" stroke-width="2" stroke-dasharray="5 4"/><text x="250" y="14" fill="var(--ac)" font-size="11">S + t</text>
<polygon points="128,70 128,106 170,92" fill="#ef4444" opacity=".5"/>
<text x="140" y="60" fill="#ef4444" font-size="10">DWL</text>
<circle cx="128" cy="70" r="4" fill="var(--ac)"/><text x="60" y="68" fill="var(--ac)" font-size="10">P_d</text>
<circle cx="128" cy="106" r="4" fill="#22c55e"/><text x="60" y="112" fill="#22c55e" font-size="10">P_s</text>
<text x="300" y="188" fill="var(--mu)" font-size="11">Q</text><text x="8" y="18" fill="var(--mu)" font-size="11">P</text></svg>
<h4>Распределение бремени</h4>
<div class="fml">доля потребителя = E<sub>s</sub> / (E<sub>s</sub> + |E<sub>d</sub>|) &nbsp;&nbsp;·&nbsp;&nbsp; доля производителя = |E<sub>d</sub>| / (E<sub>s</sub> + |E<sub>d</sub>|)</div>
<p>Налоговые сборы государства: T = t · Q<sub>t</sub>. Чистые потери общества (треугольник Харбергера):</p>
<div class="fml">DWL = ½ · t · (Q* − Q<sub>t</sub>) = ½ · t² · [b·d/(b+d)] &nbsp;(для линейных функций)</div>
<p>Важное следствие: DWL растёт пропорционально <b>квадрату</b> ставки налога. Удвоение ставки учетверяет потери — это аргумент в пользу «широкой базы и низких ставок» в теории оптимального налогообложения. Правило Рамсея: облагать сильнее те блага, спрос на которые менее эластичен (минимизация искажений).</p>
<h3><i class="fa-solid fa-5"></i> Потоварная субсидия</h3>
<p><b>Субсидия s</b> — отрицательный налог: кривая предложения сдвигается вниз на s. Цена для покупателя падает, цена, получаемая продавцом, растёт, объём превышает равновесный.</p>
<div class="fml">P<sub>s</sub> − P<sub>d</sub> = s &nbsp;|&nbsp; Расходы бюджета = s · Q<sub>s</sub> &nbsp;|&nbsp; DWL = ½ · s · (Q<sub>s</sub> − Q*)</div>
<p>Субсидия тоже порождает мёртвый груз: расходы бюджета превышают суммарный прирост излишков потребителей и производителей, поскольку часть единиц производится с предельными издержками, превышающими готовность платить.</p>
<div class="note"><b>Вывод:</b> любое ценовое или налоговое вмешательство в эффективный конкурентный рынок перераспределяет излишки и одновременно уменьшает общий «пирог» благосостояния. Экономическое обоснование вмешательства — только наличие провалов рынка (внешние эффекты, общественные блага, асимметрия информации, монопольная власть) или явно сформулированные распределительные цели.</div>
`,

M.push({id:5,title:'Кардиналистская теория полезности',icon:'fa-cubes-stacked',short:'TU и MU, первый и второй законы Госсена, равновесие потребителя в кардинализме',
lecture:`
<h3><i class="fa-solid fa-1"></i> Количественный (кардиналистский) подход</h3>
<p>Теория, развитая У. Джевонсом, К. Менгером и Л. Вальрасом в 1870-х годах («маржиналистская революция»), исходит из того, что потребитель способен <em>количественно</em> измерить полезность каждого блага в условных единицах — ютилях (utils).</p>
<p><b>Полезность (U)</b> — субъективное удовлетворение, получаемое от потребления блага. Это не объективная «полезность для здоровья», а индивидуальная оценка конкретного потребителя в конкретных обстоятельствах.</p>
<h4>Совокупная и предельная полезность</h4>
<div class="fml">TU = f(Q) &nbsp;&nbsp;·&nbsp;&nbsp; MU = ΔTU/ΔQ = dTU/dQ &nbsp;&nbsp;·&nbsp;&nbsp; TU = Σ MU<sub>i</sub></div>
<p><b>Совокупная полезность (TU)</b> — суммарное удовлетворение от всего потреблённого количества. <b>Предельная полезность (MU)</b> — прирост TU от дополнительной единицы блага; геометрически это наклон касательной к кривой TU.</p>
<table class="t"><tr><th>Q</th><th>TU</th><th>MU</th><th>Комментарий</th></tr>
<tr><td>1</td><td>20</td><td>20</td><td>первый стакан воды в жару</td></tr>
<tr><td>2</td><td>36</td><td>16</td><td>MU убывает</td></tr>
<tr><td>3</td><td>48</td><td>12</td><td>—</td></tr>
<tr><td>4</td><td>56</td><td>8</td><td>—</td></tr>
<tr><td>5</td><td>60</td><td>4</td><td>почти насыщение</td></tr>
<tr><td>6</td><td>60</td><td>0</td><td>TU максимальна</td></tr>
<tr><td>7</td><td>56</td><td>−4</td><td>антиблаго, пресыщение</td></tr></table>
<h3><i class="fa-solid fa-2"></i> Первый закон Госсена</h3>
<p><b>Закон убывающей предельной полезности:</b> по мере увеличения потребления блага в рамках одного непрерывного акта потребления предельная полезность каждой дополнительной единицы убывает.</p>
<svg viewBox="0 0 330 190" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="10" x2="40" y2="155" stroke="var(--mu)" stroke-width="1.5"/><line x1="40" y1="155" x2="312" y2="155" stroke="var(--mu)" stroke-width="1.5"/>
<path d="M40 150 Q 130 35 200 30 Q 250 28 280 45" fill="none" stroke="var(--p2)" stroke-width="2.5"/>
<text x="205" y="22" fill="var(--p2)" font-size="11">TU</text>
<line x1="40" y1="60" x2="235" y2="155" stroke="#22c55e" stroke-width="2.5"/><text x="150" y="105" fill="#22c55e" font-size="11">MU</text>
<line x1="200" y1="30" x2="200" y2="155" stroke="var(--ac)" stroke-dasharray="3 3"/>
<text x="204" y="150" fill="var(--ac)" font-size="10">MU = 0, TU max</text>
<text x="300" y="175" fill="var(--mu)" font-size="11">Q</text><text x="6" y="18" fill="var(--mu)" font-size="11">U</text></svg>
<p>Связь кривых строгая: пока MU &gt; 0, TU растёт; при MU = 0 TU достигает максимума (точка насыщения); при MU &lt; 0 TU снижается. Закон объясняет и отрицательный наклон кривой спроса: за менее ценную дополнительную единицу потребитель готов заплатить меньше.</p>
<div class="note"><b>Парадокс воды и алмазов</b> (А. Смит): вода жизненно необходима, но дёшева, алмазы бесполезны, но дороги. Разрешение маржиналистов: цену определяет не совокупная, а <em>предельная</em> полезность. Вода в изобилии ⇒ MU последнего литра ничтожна; алмазы редки ⇒ MU последнего карата огромна.</div>
<h3><i class="fa-solid fa-3"></i> Второй закон Госсена и равновесие потребителя</h3>
<p>Потребитель с ограниченным доходом I максимизирует TU. Он должен распределять бюджет так, чтобы последний рубль, потраченный на любое благо, приносил одинаковый прирост полезности:</p>
<div class="fml">MU<sub>x</sub>/P<sub>x</sub> = MU<sub>y</sub>/P<sub>y</sub> = … = MU<sub>n</sub>/P<sub>n</sub> = λ<br>при бюджетном ограничении: P<sub>x</sub>X + P<sub>y</sub>Y = I</div>
<p>Величина λ — <b>предельная полезность денег</b> (теневая цена бюджетного ограничения): на сколько ютилей вырастет максимальная полезность, если доход увеличить на одну денежную единицу.</p>
<h4>Логика выравнивания</h4>
<p>Если MU<sub>x</sub>/P<sub>x</sub> &gt; MU<sub>y</sub>/P<sub>y</sub>, то рубль, переброшенный с Y на X, увеличивает TU. Потребитель наращивает X (его MU падает по первому закону Госсена) и сокращает Y (его MU растёт), пока взвешенные полезности не сравняются. Равновесие устойчиво именно благодаря убыванию MU.</p>
<h4>Пример расчёта</h4>
<p>Пусть I = 20, P<sub>x</sub> = 2, P<sub>y</sub> = 1. MU<sub>x</sub> по единицам: 20, 18, 14, 10, 6; MU<sub>y</sub>: 11, 10, 9, 8, 7, 6, 5, 4. Взвешенные полезности X: 10, 9, 7, 5, 3; Y: 11, 10, 9, 8, 7, 6, 5, 4. Отбираем лучшие «рубли» по убыванию до исчерпания бюджета: Y₁ (11), X₁ (10) и Y₂ (10), Y₃ (9), X₂ (9), Y₄ (8)… В оптимуме выполняется MU<sub>x</sub>/P<sub>x</sub> = MU<sub>y</sub>/P<sub>y</sub> при полном расходовании дохода.</p>
<h3><i class="fa-solid fa-4"></i> От полезности к спросу</h3>
<p>Из условия равновесия MU<sub>x</sub> = λ·P<sub>x</sub> следует, что при снижении P<sub>x</sub> потребитель увеличивает X до тех пор, пока MU<sub>x</sub> не упадёт до нового уровня λP<sub>x</sub>. Таким образом, <b>кривая спроса — это убывающая кривая предельной полезности, пересчитанная в денежные единицы</b>, а индивидуальный излишек потребителя — накопленное превышение полезности над расходами.</p>
<p><b>Критика кардинализма:</b> полезность неизмерима и несопоставима между людьми, гипотеза постоянства λ некорректна. Эти ограничения преодолевает ординалистский подход (тема 6), которому требуется лишь способность потребителя <em>ранжировать</em> наборы.</p>
`,

M.push({id:6,title:'Ординалистская теория полезности',icon:'fa-chart-area',short:'Аксиомы, кривые безразличия, MRS, бюджетная линия и её сдвиги',
lecture:`
<h3><i class="fa-solid fa-1"></i> Порядковый подход и его аксиомы</h3>
<p>Ординализм (В. Парето, Дж. Хикс, Р. Аллен, Е. Слуцкий) отказывается от измерения полезности в ютилях. Достаточно, чтобы потребитель умел <em>сравнивать и ранжировать</em> наборы благ. Функция полезности остаётся, но определена с точностью до любого монотонно возрастающего преобразования: U и U³ + 5 описывают одни и те же предпочтения.</p>
<h4>Аксиомы потребительского выбора</h4>
<ul>
<li><b>Полнота (сравнимость):</b> для любых наборов A и B выполняется A ≻ B, B ≻ A или A ~ B.</li>
<li><b>Транзитивность:</b> если A ≻ B и B ≻ C, то A ≻ C (рациональная непротиворечивость).</li>
<li><b>Ненасыщаемость:</b> большее количество блага предпочтительнее меньшего («больше — лучше»).</li>
<li><b>Непрерывность:</b> малое изменение набора вызывает малое изменение оценки — гарантирует существование непрерывной функции полезности.</li>
<li><b>Выпуклость предпочтений:</b> потребитель предпочитает «смешанные» наборы крайним, что даёт убывающую MRS.</li>
</ul>
<h3><i class="fa-solid fa-2"></i> Кривые безразличия</h3>
<p><b>Кривая безразличия (IC)</b> — множество наборов благ, обеспечивающих потребителю одинаковый уровень полезности. <b>Карта кривых безразличия</b> — совокупность кривых, отражающих разные уровни полезности.</p>
<svg viewBox="0 0 330 195" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="10" x2="40" y2="160" stroke="var(--mu)" stroke-width="1.5"/><line x1="40" y1="160" x2="312" y2="160" stroke="var(--mu)" stroke-width="1.5"/>
<path d="M55 150 Q 95 70 175 62 Q 230 57 255 50" fill="none" stroke="var(--p2)" stroke-width="2"/>
<path d="M70 155 Q 130 95 205 88 Q 255 84 285 80" fill="none" stroke="var(--p2)" stroke-width="2" opacity=".65"/>
<path d="M50 120 Q 80 45 140 35 Q 190 28 230 22" fill="none" stroke="var(--p2)" stroke-width="2" opacity=".4"/>
<text x="258" y="46" fill="var(--p2)" font-size="10">U₂</text><text x="288" y="78" fill="var(--p2)" font-size="10">U₁</text><text x="233" y="20" fill="var(--p2)" font-size="10">U₃</text>
<line x1="40" y1="30" x2="240" y2="160" stroke="var(--ac)" stroke-width="2"/><text x="200" y="146" fill="var(--ac)" font-size="10">бюджет</text>
<circle cx="120" cy="82" r="4.5" fill="#22c55e"/><text x="126" y="78" fill="#22c55e" font-size="10">E</text>
<text x="300" y="180" fill="var(--mu)" font-size="11">X</text><text x="8" y="18" fill="var(--mu)" font-size="11">Y</text></svg>
<h4>Свойства кривых безразличия</h4>
<ol>
<li>Имеют <b>отрицательный наклон</b> (следствие ненасыщаемости).</li>
<li><b>Не пересекаются</b> — иначе нарушается транзитивность.</li>
<li>Более высокая кривая соответствует <b>большей полезности</b>.</li>
<li><b>Выпуклы к началу координат</b> (убывающая MRS).</li>
<li>Через любую точку пространства благ проходит ровно одна кривая.</li>
</ol>
<h4>Частные случаи</h4>
<ul>
<li><b>Совершенные субституты:</b> U = aX + bY, кривые — прямые линии, MRS = a/b = const.</li>
<li><b>Совершенные комплементы:</b> U = min(aX, bY), кривые имеют L-образную форму (кофе и сахар в фиксированной пропорции).</li>
<li><b>Нейтральное благо и антиблаго:</b> горизонтальные/вертикальные или восходящие кривые.</li>
</ul>
<h3><i class="fa-solid fa-3"></i> Предельная норма замещения (MRS)</h3>
<p><b>MRS<sub>xy</sub></b> — количество блага Y, от которого потребитель готов отказаться ради дополнительной единицы X, оставаясь на той же кривой безразличия. Это модуль наклона кривой безразличия:</p>
<div class="fml">MRS<sub>xy</sub> = −ΔY/ΔX |<sub>U = const</sub> = MU<sub>x</sub>/MU<sub>y</sub></div>
<p>Вывод связи: вдоль кривой dU = MU<sub>x</sub>dX + MU<sub>y</sub>dY = 0 ⇒ −dY/dX = MU<sub>x</sub>/MU<sub>y</sub>. <b>Закон убывающей MRS:</b> по мере роста X потребитель всё менее охотно отдаёт Y за очередную единицу X, поскольку X становится относительно изобильным. Это и обеспечивает выпуклость IC.</p>
<p>Для функции Кобба–Дугласа U = X<sup>α</sup>Y<sup>β</sup>: MU<sub>x</sub> = αX<sup>α−1</sup>Y<sup>β</sup>, MU<sub>y</sub> = βX<sup>α</sup>Y<sup>β−1</sup>, отсюда</p>
<div class="fml">MRS<sub>xy</sub> = (α/β) · (Y/X)</div>
<h3><i class="fa-solid fa-4"></i> Бюджетное ограничение</h3>
<div class="fml">I = P<sub>x</sub>·X + P<sub>y</sub>·Y &nbsp;⟺&nbsp; Y = I/P<sub>y</sub> − (P<sub>x</sub>/P<sub>y</sub>)·X</div>
<p>Точки пересечения с осями: I/P<sub>x</sub> (всё на X) и I/P<sub>y</sub> (всё на Y). Наклон −P<sub>x</sub>/P<sub>y</sub> показывает <b>рыночную норму замещения</b> — пропорцию, в которой рынок позволяет обменивать блага.</p>
<h4>Сдвиги бюджетной линии</h4>
<ul>
<li><b>Рост дохода I</b> (цены неизменны) — параллельный сдвиг вправо-вверх;</li>
<li><b>Рост P<sub>x</sub></b> — поворот вокруг точки I/P<sub>y</sub> внутрь (линия становится круче);</li>
<li><b>Пропорциональный рост всех цен и дохода</b> — линия не меняется (отсутствие денежной иллюзии, нулевая однородность спроса);</li>
<li><b>Количественные ограничения, талоны, двухставочные тарифы</b> дают излом бюджетной линии.</li>
</ul>
<div class="note"><b>Ключевая идея темы:</b> предпочтения (кривые безразличия) описывают «чего хочет» потребитель, бюджетная линия — «что он может». Их совмещение в теме 7 даёт оптимум: MRS<sub>xy</sub> = P<sub>x</sub>/P<sub>y</sub>, то есть субъективная норма обмена равна объективной рыночной.</div>
`,

M.push({id:7,title:'Оптимум потребителя',icon:'fa-bullseye',short:'Равновесие MRS = Px/Py, кривые «доход–потребление» и Энгеля, построение спроса',
lecture:`
<h3><i class="fa-solid fa-1"></i> Условие оптимума</h3>
<p>Потребитель максимизирует полезность U(X, Y) при бюджетном ограничении P<sub>x</sub>X + P<sub>y</sub>Y = I. Графически оптимум — точка <b>касания</b> наивысшей достижимой кривой безразличия и бюджетной линии.</p>
<div class="fml">MRS<sub>xy</sub> = MU<sub>x</sub>/MU<sub>y</sub> = P<sub>x</sub>/P<sub>y</sub> &nbsp;&nbsp;⟺&nbsp;&nbsp; MU<sub>x</sub>/P<sub>x</sub> = MU<sub>y</sub>/P<sub>y</sub> = λ</div>
<p>Экономический смысл: субъективная норма замены (готовность потребителя) совпала с рыночной (возможность обмена). Если MRS &gt; P<sub>x</sub>/P<sub>y</sub>, потребитель ценит X выше, чем рынок, и наращивает X; если MRS &lt; P<sub>x</sub>/P<sub>y</sub> — наоборот.</p>
<h4>Алгебраическое решение (метод Лагранжа)</h4>
<div class="fml">L = U(X,Y) + λ(I − P<sub>x</sub>X − P<sub>y</sub>Y)<br>∂L/∂X = MU<sub>x</sub> − λP<sub>x</sub> = 0; ∂L/∂Y = MU<sub>y</sub> − λP<sub>y</sub> = 0; ∂L/∂λ = I − P<sub>x</sub>X − P<sub>y</sub>Y = 0</div>
<p>Для функции Кобба–Дугласа U = X<sup>α</sup>Y<sup>β</sup> решение даёт знаменитые формулы постоянных долей расходов:</p>
<div class="fml">X* = [α/(α+β)] · I/P<sub>x</sub> &nbsp;&nbsp;·&nbsp;&nbsp; Y* = [β/(α+β)] · I/P<sub>y</sub></div>
<p>При α = β = 0,5 потребитель тратит ровно половину дохода на каждое благо: X* = I/(2P<sub>x</sub>).</p>
<h4>Угловые решения</h4>
<p>Если предпочтения не строго выпуклы или одно благо «слишком дорого», касание невозможно, и оптимум лежит на оси координат (<b>угловое решение</b>). Пример: совершенные субституты U = 2X + Y при P<sub>x</sub> = 1, P<sub>y</sub> = 1 — потребитель тратит весь доход на X, поскольку MRS = 2 &gt; P<sub>x</sub>/P<sub>y</sub> = 1 всюду.</p>
<h3><i class="fa-solid fa-2"></i> Реакция на изменение дохода</h3>
<p>Рост I сдвигает бюджетную линию параллельно. Соединив последовательные точки оптимума, получаем <b>кривую «доход–потребление» (ICC, income-consumption curve)</b>.</p>
<ul>
<li>Если ICC имеет положительный наклон по обоим благам — оба блага <b>нормальные</b>.</li>
<li>Если ICC загибается назад по одному из благ — это благо <b>инфериорное</b> на данном участке дохода.</li>
</ul>

<h3><i class="fa-solid fa-3"></i> Реакция на изменение цены и построение спроса</h3>
<p>Снижение P<sub>x</sub> поворачивает бюджетную линию наружу вокруг точки I/P<sub>y</sub>. Множество точек оптимума при разных ценах X образует <b>кривую «цена–потребление» (PCC, price-consumption curve)</b>.</p>
<p>Перенося пары (P<sub>x</sub>; X*) в координаты цена–количество, получаем <b>индивидуальную кривую спроса</b>. Таким образом, закон спроса выводится не постулируется: он следует из максимизации полезности при выпуклых предпочтениях (за исключением случая Гиффена, см. тему 8).</p>
<table class="t"><tr><th>Форма PCC</th><th>Эластичность спроса</th><th>Расходы на X</th></tr>
<tr><td>нисходящая</td><td>|E| &gt; 1 (эластичный)</td><td>растут при P↓</td></tr>
<tr><td>горизонтальная</td><td>|E| = 1</td><td>постоянны (Кобб–Дуглас)</td></tr>
<tr><td>восходящая</td><td>|E| &lt; 1 (неэластичный)</td><td>снижаются при P↓</td></tr></table>
<h4>От индивидуального спроса к рыночному</h4>
<p>Рыночный спрос получается <b>горизонтальным суммированием</b> индивидуальных кривых: при каждой цене складываются величины спроса всех потребителей. Если Q₁ = 20 − P и Q₂ = 30 − 2P, то при P ≤ 15 рыночный спрос Q = 50 − 3P, а при 15 &lt; P ≤ 20 остаётся только первый покупатель: Q = 20 − P (кривая имеет излом).</p>
<div class="note"><b>Практическое применение:</b> из условий оптимума выводится вся эмпирическая теория спроса — оценка функций Энгеля по бюджетным обследованиям домохозяйств, расчёт индексов стоимости жизни, анализ влияния адресных трансфертов (денежная помощь всегда не хуже натуральной при тех же расходах бюджета).</div>

M.push({id:8,title:'Эффект дохода и эффект замещения',icon:'fa-shuffle',short:'Разложение по Хиксу и по Слуцкому, товары Гиффена, эффект Веблена',
lecture:`
<h3><i class="fa-solid fa-1"></i> Два компонента реакции на цену</h3>
<p>Когда цена блага X падает, потребитель реагирует по двум причинам:</p>
<ul>
<li><b>Эффект замещения (SE)</b> — относительное удешевление X побуждает заменять им другие блага. Направлен <em>всегда</em> против изменения цены: цена↓ ⇒ потребление↑.</li>
<li><b>Эффект дохода (IE)</b> — снижение цены повышает реальную покупательную способность, и потребитель может купить больше всех благ. Направление зависит от типа блага: для нормального IE усиливает SE, для инфериорного — противодействует.</li>
</ul>
<div class="fml">Общий эффект = SE + IE &nbsp;&nbsp;(уравнение Слуцкого в дискретной форме)</div>
<table class="t"><tr><th>Тип блага</th><th>SE</th><th>IE</th><th>Общий эффект при P↓</th></tr>
<tr><td>Нормальное</td><td>+</td><td>+</td><td>рост спроса</td></tr>
<tr><td>Инфериорное (обычное)</td><td>+</td><td>−, но |IE| &lt; SE</td><td>рост спроса</td></tr>
<tr><td>Гиффена</td><td>+</td><td>−, и |IE| &gt; SE</td><td>сокращение спроса</td></tr></table>
<h3><i class="fa-solid fa-2"></i> Разложение по Хиксу</h3>
<p>Подход Дж. Хикса основан на <b>постоянстве уровня полезности</b>: гипотетическая компенсация такова, что потребитель остаётся на <em>исходной кривой безразличия</em>.</p>
<p>Процедура: строим вспомогательную бюджетную линию с <b>новым наклоном</b> (новое соотношение цен), касающуюся <em>старой</em> кривой безразличия U₀. Перемещение из исходной точки A в точку касания B — <b>эффект замещения по Хиксу</b>; переход из B в новый оптимум C — <b>эффект дохода</b>.</p>
<svg viewBox="0 0 330 200" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="10" x2="40" y2="165" stroke="var(--mu)" stroke-width="1.5"/><line x1="40" y1="165" x2="312" y2="165" stroke="var(--mu)" stroke-width="1.5"/>
<path d="M55 155 Q 100 80 190 68 Q 250 62 290 58" fill="none" stroke="var(--p2)" stroke-width="2"/><text x="292" y="54" fill="var(--p2)" font-size="10">U₀</text>
<path d="M80 160 Q 140 100 230 90 Q 275 86 305 84" fill="none" stroke="var(--p2)" stroke-width="2" opacity=".55"/><text x="300" y="100" fill="var(--p2)" font-size="10">U₁</text>
<line x1="40" y1="40" x2="170" y2="165" stroke="var(--ac)" stroke-width="2"/>
<line x1="40" y1="75" x2="285" y2="165" stroke="#3b9bff" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="40" y1="30" x2="300" y2="165" stroke="#22c55e" stroke-width="2"/>
<circle cx="95" cy="92" r="4" fill="#fff"/><text x="80" y="86" fill="#fff" font-size="10">A</text>
<circle cx="160" cy="72" r="4" fill="#3b9bff"/><text x="156" y="64" fill="#3b9bff" font-size="10">B</text>
<circle cx="205" cy="94" r="4" fill="#22c55e"/><text x="210" y="88" fill="#22c55e" font-size="10">C</text>
<text x="296" y="185" fill="var(--mu)" font-size="11">X</text><text x="8" y="18" fill="var(--mu)" font-size="11">Y</text></svg>
<h3><i class="fa-solid fa-3"></i> Разложение по Слуцкому</h3>
<p>Е. Слуцкий (1915) предложил компенсацию, сохраняющую <b>покупательную способность</b>: потребителю оставляют доход, достаточный для приобретения <em>исходного набора</em> благ по новым ценам.</p>
<div class="fml">I' = P<sub>x</sub>'·X₀ + P<sub>y</sub>·Y₀ &nbsp;&nbsp;(компенсированный по Слуцкому доход)</div>
<p>Отличие от Хикса: вспомогательная линия проходит <em>через исходную точку A</em>, а не касается старой кривой безразличия. Поэтому по Слуцкому потребитель оказывается на чуть более высокой кривой безразличия, и эффект замещения по Слуцкому по модулю больше (для малых изменений цен разница второго порядка малости, и оба разложения совпадают).</p>
<p><b>Уравнение Слуцкого</b> в непрерывной форме (ключевой результат теории спроса):</p>
<div class="fml">∂X/∂P<sub>x</sub> = (∂X/∂P<sub>x</sub>)|<sub>U=const</sub> − X · (∂X/∂I)</div>
<p>Первое слагаемое — всегда отрицательный эффект замещения (компенсированный спрос убывает по цене — закон спроса Хикса), второе — эффект дохода, знак которого определяется типом блага.</p>
<h4>Числовой пример</h4>
<p>U = XY, I = 200, P<sub>y</sub> = 10, P<sub>x</sub> падает с 10 до 5. Исходный оптимум: X₀ = 200/(2·10) = 10, Y₀ = 10. Новый оптимум: X₁ = 200/(2·5) = 20. Общий эффект = +10.</p>
<p>Слуцкий: I' = 5·10 + 10·10 = 150. Спрос при I' и новых ценах: X<sub>S</sub> = 150/(2·5) = 15 ⇒ SE = 15 − 10 = +5, IE = 20 − 15 = +5.</p>
<p>Хикс: U₀ = 10·10 = 100. Минимизация расходов при U = 100 и ценах (5; 10): X<sub>H</sub> = √(U₀·P<sub>y</sub>/P<sub>x</sub>) = √(100·2) ≈ 14,14 ⇒ SE<sub>H</sub> ≈ +4,14, IE<sub>H</sub> ≈ +5,86.</p>
<h3><i class="fa-solid fa-4"></i> Товары Гиффена и эффект Веблена</h3>
<p><b>Товар Гиффена</b> — сильно инфериорное благо, занимающее значительную долю бюджета бедного домохозяйства, для которого эффект дохода перевешивает эффект замещения. Результат — восходящая кривая спроса: цена↑ ⇒ спрос↑. Исторический пример — картофель в Ирландии XIX века; современные эмпирические подтверждения — рис и лапша у беднейших домохозяйств провинции Хунань (Дженсен и Миллер, 2008).</p>
<p><b>Эффект Веблена</b> (демонстративное потребление) — спрос растёт с ценой, но по иной причине: высокая цена сама является носителем престижа. Это не нарушение теории спроса, а изменение предпочтений при изменении цены. Сюда же примыкают <b>эффект сноба</b> (отрицательная зависимость от числа других потребителей) и <b>эффект присоединения к большинству</b> (bandwagon).</p>
<div class="note"><b>Итог:</b> Любое изменение цены всегда раскладывается на «чистое» замещение и «доходный» компонент. Это разложение лежит в основе теории индексов цен, анализа компенсирующей и эквивалентной вариаций дохода (CV и EV) и оценки благосостояния при налоговых реформах.</div>
`,

M.push({id:9,title:'Производственная функция',icon:'fa-industry',short:'Короткий период, TP, AP и MP фактора, закон убывающей предельной производительности',
lecture:`
<h3><i class="fa-solid fa-1"></i> Фирма и производственная функция</h3>
<p><b>Производственная функция</b> — техническое соотношение, показывающее максимальный выпуск Q, достижимый при каждом наборе факторов производства и данном уровне технологии:</p>
<div class="fml">Q = f(L, K, T, …) &nbsp;&nbsp;·&nbsp;&nbsp; частный случай Кобба–Дугласа: Q = A·L<sup>α</sup>·K<sup>β</sup></div>
<p>Функция описывает только <em>технически эффективные</em> комбинации: для каждого набора ресурсов берётся максимально возможный выпуск.</p>
<h4>Периоды производства</h4>
<ul>
<li><b>Мгновенный период</b> — все факторы фиксированы, выпуск изменить нельзя.</li>
<li><b>Короткий (краткосрочный) период</b> — хотя бы один фактор фиксирован (обычно капитал K̄), переменным выступает труд L. Число фирм в отрасли постоянно.</li>
<li><b>Длительный (долгосрочный) период</b> — все факторы переменны, возможен вход и выход фирм из отрасли.</li>
</ul>
<h3><i class="fa-solid fa-2"></i> Совокупный, средний и предельный продукт</h3>
<div class="fml">TP<sub>L</sub> = Q = f(L, K̄) &nbsp;·&nbsp; AP<sub>L</sub> = TP/L &nbsp;·&nbsp; MP<sub>L</sub> = ΔTP/ΔL = dTP/dL</div>
<table class="t"><tr><th>L</th><th>TP</th><th>MP</th><th>AP</th><th>Стадия</th></tr>
<tr><td>1</td><td>10</td><td>10</td><td>10,0</td><td rowspan="2">I: растущая отдача</td></tr>
<tr><td>2</td><td>24</td><td>14</td><td>12,0</td></tr>
<tr><td>3</td><td>39</td><td>15</td><td>13,0</td><td>MP = max</td></tr>
<tr><td>4</td><td>52</td><td>13</td><td>13,0</td><td>AP = max = MP</td></tr>
<tr><td>5</td><td>60</td><td>8</td><td>12,0</td><td rowspan="2">II: убывающая отдача</td></tr>
<tr><td>6</td><td>63</td><td>3</td><td>10,5</td></tr>
<tr><td>7</td><td>63</td><td>0</td><td>9,0</td><td>TP = max</td></tr>

<svg viewBox="0 0 330 200" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="10" x2="40" y2="165" stroke="var(--mu)" stroke-width="1.5"/><line x1="40" y1="165" x2="312" y2="165" stroke="var(--mu)" stroke-width="1.5"/>
<path d="M40 162 Q 90 130 140 70 Q 190 20 240 22 Q 270 24 290 45" fill="none" stroke="var(--p2)" stroke-width="2.5"/><text x="246" y="16" fill="var(--p2)" font-size="10">TP</text>
<path d="M40 120 Q 80 90 110 92 Q 170 100 230 160" fill="none" stroke="#3b9bff" stroke-width="2"/><text x="100" y="86" fill="#3b9bff" font-size="10">MP</text>
<path d="M40 135 Q 90 105 140 110 Q 200 118 280 150" fill="none" stroke="#22c55e" stroke-width="2"/><text x="150" y="105" fill="#22c55e" font-size="10">AP</text>
<line x1="140" y1="70" x2="140" y2="165" stroke="var(--ac)" stroke-dasharray="3 3"/>
<text x="296" y="185" fill="var(--mu)" font-size="11">L</text><text x="8" y="18" fill="var(--mu)" font-size="11">Q</text></svg>
<h4>Геометрические связи</h4>
<ul>
<li>MP — наклон касательной к TP; MP максимален в точке перегиба TP.</li>
<li>AP — наклон луча из начала координат к точке на TP; AP максимален там, где луч касается TP.</li>
<li><b>MP &gt; AP ⇒ AP растёт; MP &lt; AP ⇒ AP снижается; MP = AP ⇒ AP максимален.</b> (Правило «среднего и предельного»: студент с оценкой выше среднего балла поднимает средний балл.)</li>
<li>TP максимален при MP = 0; дальше начинается зона отрицательной отдачи, где наём рабочих абсурден.</li>
</ul>
<h3><i class="fa-solid fa-3"></i> Закон убывающей предельной производительности</h3>
<p><b>Формулировка:</b> начиная с некоторого момента, последовательное присоединение дополнительных единиц переменного фактора к фиксированному фактору даёт убывающий предельный продукт.</p>
<p>Причина — изменение <em>пропорции</em> между факторами: всё больше работников приходится на один и тот же объём оборудования и площадей. Закон носит технологический, а не экономический характер и предполагает: (1) неизменность технологии, (2) однородность качества единиц переменного фактора, (3) хотя бы один фиксированный фактор.</p>
<div class="note"><b>Три стадии производства.</b> Стадия I (от 0 до L, где AP = max) — фиксированный фактор недоиспользован, наращивание труда выгодно. Стадия II (от AP<sub>max</sub> до MP = 0) — <em>экономически рациональная зона</em>, в которой всегда находится оптимум фирмы. Стадия III (MP &lt; 0) — переменного фактора избыток, выпуск падает.</div>
<h3><i class="fa-solid fa-4"></i> Аналитический аппарат</h3>
<p>Пример: Q = −L³ + 12L² + 60L при фиксированном K.</p>
<div class="fml">AP = Q/L = −L² + 12L + 60 → max при dAP/dL = −2L + 12 = 0 ⇒ L = 6<br>MP = dQ/dL = −3L² + 24L + 60 → max при dMP/dL = −6L + 24 = 0 ⇒ L = 4<br>TP → max при MP = 0 ⇒ −3L² + 24L + 60 = 0 ⇒ L = 10</div>
<p>Проверка связи: при L = 6 AP = −36 + 72 + 60 = 96 и MP = −108 + 144 + 60 = 96 — равенство AP = MP в точке максимума AP подтверждается.</p>
<p>Для функции Кобба–Дугласа Q = AL<sup>α</sup>K<sup>β</sup>: MP<sub>L</sub> = αQ/L = α·AP<sub>L</sub>, поэтому при α &lt; 1 предельный продукт всегда меньше среднего, и AP монотонно убывает — закон убывающей отдачи выполняется с первой единицы труда. Показатели α и β одновременно являются эластичностями выпуска по факторам.</p>
`,

M.push({id:10,title:'Издержки производства в коротком периоде',icon:'fa-coins',short:'FC, VC, TC; AFC, AVC, ATC и MC; связь предельных и средних издержек',
lecture:`
<h3><i class="fa-solid fa-1"></i> Классификация издержек</h3>
<p>В коротком периоде ресурсы делятся на постоянные и переменные, что порождает базовое разделение издержек:</p>
<ul>
<li><b>Постоянные издержки FC (fixed costs)</b> — не зависят от объёма выпуска: арендная плата, амортизация, оклады администрации, страховка, проценты по кредиту. Существуют даже при Q = 0.</li>
<li><b>Переменные издержки VC (variable costs)</b> — растут с выпуском: сырьё, сдельная оплата труда, электроэнергия на технологические нужды.</li>
<li><b>Общие издержки TC = FC + VC.</b></li>
</ul>
<p>Форма кривой VC определяется производственной функцией: пока действует возрастающая отдача, VC растут замедленно (вогнутый участок); после вступления в силу закона убывающей отдачи — ускоренно (выпуклый участок). Точка перегиба VC соответствует максимуму MP<sub>L</sub>.</p>
<h3><i class="fa-solid fa-2"></i> Средние издержки</h3>
<div class="fml">AFC = FC/Q &nbsp;·&nbsp; AVC = VC/Q &nbsp;·&nbsp; ATC = TC/Q = AFC + AVC</div>
<ul>
<li><b>AFC</b> монотонно убывает и асимптотически приближается к нулю — «размазывание» постоянных издержек по растущему выпуску (эффект масштаба в бытовом смысле).</li>
<li><b>AVC</b> U-образна: сначала убывает (растущая отдача переменного фактора), затем растёт. AVC = w/AP<sub>L</sub>, то есть минимум AVC достигается при максимуме AP<sub>L</sub>.</li>
<li><b>ATC</b> также U-образна и лежит выше AVC; разрыв между ними равен AFC и сокращается с ростом Q. Минимум ATC достигается <em>правее</em> минимума AVC.</li>
</ul>
<h3><i class="fa-solid fa-3"></i> Предельные издержки</h3>
<div class="fml">MC = ΔTC/ΔQ = dTC/dQ = dVC/dQ &nbsp;&nbsp;(FC не влияют на MC!)</div>
<p>Связь с производством: MC = w/MP<sub>L</sub>. Поэтому кривая MC — «зеркальное отражение» кривой предельного продукта: пока MP растёт, MC падает; как только вступает в силу закон убывающей отдачи, MC начинает расти.</p>
<svg viewBox="0 0 330 205" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="10" x2="40" y2="170" stroke="var(--mu)" stroke-width="1.5"/><line x1="40" y1="170" x2="312" y2="170" stroke="var(--mu)" stroke-width="1.5"/>
<path d="M55 120 Q 100 165 150 150 Q 215 128 285 25" fill="none" stroke="#3b9bff" stroke-width="2.5"/><text x="275" y="22" fill="#3b9bff" font-size="10">MC</text>
<path d="M55 95 Q 120 150 175 148 Q 240 144 290 90" fill="none" stroke="var(--p2)" stroke-width="2.5"/><text x="292" y="88" fill="var(--p2)" font-size="10">ATC</text>
<path d="M55 135 Q 110 162 160 160 Q 230 156 290 115" fill="none" stroke="#22c55e" stroke-width="2.5"/><text x="292" y="113" fill="#22c55e" font-size="10">AVC</text>
<path d="M55 60 Q 110 140 200 160 Q 250 166 290 168" fill="none" stroke="var(--ac)" stroke-width="2" stroke-dasharray="4 4"/><text x="80" y="54" fill="var(--ac)" font-size="10">AFC</text>
<circle cx="160" cy="160" r="4" fill="#22c55e"/><circle cx="196" cy="147" r="4" fill="var(--p2)"/>
<text x="296" y="190" fill="var(--mu)" font-size="11">Q</text><text x="8" y="18" fill="var(--mu)" font-size="11">C</text></svg>
<h4>Фундаментальная связь MC со средними издержками</h4>
<p>Кривая MC пересекает кривые AVC и ATC <b>строго в точках их минимумов</b>. Докажем для ATC:</p>
<div class="fml">d(ATC)/dQ = d(TC/Q)/dQ = (MC·Q − TC)/Q² = (MC − ATC)/Q<br>d(ATC)/dQ = 0 ⟺ MC = ATC</div>
<ul><li>MC &lt; ATC ⇒ ATC убывает;</li><li>MC &gt; ATC ⇒ ATC растёт;</li><li>MC = ATC ⇒ ATC минимальна (точка безубыточности в длительной перспективе).</li></ul>
<h3><i class="fa-solid fa-4"></i> Численный пример</h3>
<table class="t"><tr><th>Q</th><th>FC</th><th>VC</th><th>TC</th><th>AFC</th><th>AVC</th><th>ATC</th><th>MC</th></tr>
<tr><td>0</td><td>60</td><td>0</td><td>60</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>
<tr><td>1</td><td>60</td><td>30</td><td>90</td><td>60,0</td><td>30,0</td><td>90,0</td><td>30</td></tr>
<tr><td>2</td><td>60</td><td>50</td><td>110</td><td>30,0</td><td>25,0</td><td>55,0</td><td>20</td></tr>
<tr><td>3</td><td>60</td><td>66</td><td>126</td><td>20,0</td><td>22,0</td><td>42,0</td><td>16</td></tr>
<tr><td>4</td><td>60</td><td>88</td><td>148</td><td>15,0</td><td>22,0</td><td>37,0</td><td>22</td></tr>
<tr><td>5</td><td>60</td><td>120</td><td>180</td><td>12,0</td><td>24,0</td><td>36,0</td><td>32</td></tr>
<tr><td>6</td><td>60</td><td>170</td><td>230</td><td>10,0</td><td>28,3</td><td>38,3</td><td>50</td></tr></table>
<p>Минимум AVC находится между Q = 3 и Q = 4 (22,0), минимум ATC — при Q = 5 (36,0), и именно там MC (32) ближе всего подходит к ATC снизу, а при Q = 6 MC (50) уже превышает ATC, толкая средние издержки вверх.</p>
<h4>Аналитический пример</h4>
<p>Пусть TC = Q³ − 6Q² + 20Q + 16.</p>
<div class="fml">FC = 16; VC = Q³ − 6Q² + 20Q; AVC = Q² − 6Q + 20 → min при Q = 3 (AVC = 11)<br>MC = 3Q² − 12Q + 20 → при Q = 3 MC = 27 − 36 + 20 = 11 = AVC ✓</div>
<div class="note"><b>Экономический смысл:</b> минимум AVC — <em>точка закрытия</em> фирмы (ниже неё производство не покрывает даже переменных расходов), минимум ATC — <em>точка безубыточности</em>. Эти ориентиры определяют поведение фирмы в теме 12.</div>
<h3><i class="fa-solid fa-5"></i> Экономические и бухгалтерские издержки</h3>
<p>Напомним различие из темы 1: экономические издержки включают неявные (альтернативные) затраты собственных ресурсов. Поэтому <em>экономическая</em> прибыль всегда не больше бухгалтерской, а нулевая экономическая прибыль — вполне комфортное положение фирмы (нормальная прибыль получена).</p>
`,
quiz:[
 {q:'Какие издержки НЕ влияют на величину предельных издержек?',a:['Переменные','Постоянные','Средние переменные','Общие'],c:1,e:'MC = dTC/dQ = dVC/dQ: постоянные издержки при дифференцировании исчезают.'},
 {q:'Кривая MC пересекает кривую ATC:',a:['В точке максимума ATC','В точке минимума ATC','Левее минимума ATC','Никогда не пересекает'],c:1,e:'d(ATC)/dQ = (MC − ATC)/Q = 0 ⟺ MC = ATC, то есть в минимуме ATC.'},

],
seminar:[
 {type:'num',q:'FC = 100, переменные издержки заданы функцией VC = 2Q². Рассчитайте средние общие издержки ATC при Q = 10.',ans:30,tol:0.01,unit:'ден. ед.',

 {type:'num',q:'Для тех же условий (VC = 2Q²) найдите предельные издержки MC при Q = 10.',ans:40,tol:0.01,unit:'ден. ед.',
  sol:'MC = dVC/dQ = 4Q = 40. Поскольку MC (40) > ATC (30), средние издержки на этом участке растут.'},
 {type:'num',q:'VC = Q³ − 6Q² + 20Q. Чему равно минимальное значение средних переменных издержек AVC?',ans:11,tol:0.01,unit:'ден. ед.',
  sol:'AVC = Q² − 6Q + 20; dAVC/dQ = 2Q − 6 = 0 ⇒ Q = 3; AVC(3) = 9 − 18 + 20 = 11. Проверка: MC(3) = 27 − 36 + 20 = 11 = AVC ✓'},
 {type:'num',q:'TC = Q² + 16. При каком объёме выпуска средние общие издержки минимальны?',ans:4,tol:0.01,unit:'ед.',
  sol:'ATC = Q + 16/Q; dATC/dQ = 1 − 16/Q² = 0 ⇒ Q = 4; ATC(4) = 4 + 4 = 8. MC(4) = 2·4 = 8 = ATC ✓'},
 {type:'mc',q:'Фирма выпускает 50 единиц: ATC = 42, MC = 35. Что произойдёт со средними общими издержками при небольшом увеличении выпуска?',a:['Вырастут','Снизятся','Не изменятся','Станут равны AVC'],c:1,
  sol:'MC (35) < ATC (42): каждая дополнительная единица обходится дешевле текущего среднего уровня, поэтому среднее значение снижается. Фирма ещё не достигла минимума ATC.'}
]});

M.push({id:11,title:'Производство в долгосрочном периоде',icon:'fa-gears',short:'Изокванты, MRTS, изокоста, оптимум производителя, эффект масштаба и LAC',
lecture:`
<h3><i class="fa-solid fa-1"></i> Изокванты</h3>
<p>В длительном периоде переменны все факторы. <b>Изокванта</b> — линия, показывающая все технически эффективные комбинации труда L и капитала K, дающие один и тот же выпуск Q̄. Совокупность изоквант образует <b>карту изоквант</b>.</p>
<h4>Свойства изоквант</h4>
<ol><li>имеют отрицательный наклон в экономической области;</li>
<li>не пересекаются;</li>
<li>более удалённая от начала координат изокванта соответствует большему выпуску;</li>
<li>выпуклы к началу координат (убывающая MRTS).</li></ol>
<p>Частные случаи: совершенная взаимозаменяемость факторов Q = aL + bK (линейные изокванты), жёсткая дополняемость Q = min(aL, bK) — технология Леонтьева (L-образные изокванты).</p>
<h3><i class="fa-solid fa-2"></i> Предельная норма технологического замещения</h3>
<div class="fml">MRTS<sub>LK</sub> = −ΔK/ΔL |<sub>Q = const</sub> = MP<sub>L</sub> / MP<sub>K</sub></div>
<p>Вывод: вдоль изокванты dQ = MP<sub>L</sub>dL + MP<sub>K</sub>dK = 0. Для функции Кобба–Дугласа Q = AL<sup>α</sup>K<sup>β</sup>:</p>
<div class="fml">MRTS<sub>LK</sub> = (α/β)·(K/L)</div>
<p>Убывание MRTS по мере роста L отражает снижающуюся технологическую заменяемость: чем меньше капитала осталось, тем труднее компенсировать его потерю дополнительным трудом.</p>
<h3><i class="fa-solid fa-3"></i> Изокоста и оптимум производителя</h3>
<p><b>Изокоста</b> — линия равных затрат: все комбинации факторов, стоящие фирме одинаковую сумму C.</p>
<div class="fml">C = w·L + r·K &nbsp;⟺&nbsp; K = C/r − (w/r)·L &nbsp;·&nbsp; наклон = −w/r</div>
<p><b>Оптимум производителя</b> — точка касания изокванты и изокосты:</p>
<div class="fml">MRTS<sub>LK</sub> = MP<sub>L</sub>/MP<sub>K</sub> = w/r &nbsp;⟺&nbsp; MP<sub>L</sub>/w = MP<sub>K</sub>/r</div>
<p>Экономическая интерпретация второго равенства: <em>последний рубль, вложенный в любой фактор, должен давать одинаковый прирост выпуска</em>. Это точный аналог второго закона Госсена для производителя.</p>
<svg viewBox="0 0 330 200" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="10" x2="40" y2="165" stroke="var(--mu)" stroke-width="1.5"/><line x1="40" y1="165" x2="312" y2="165" stroke="var(--mu)" stroke-width="1.5"/>
<path d="M60 155 Q 95 75 180 65 Q 245 58 290 55" fill="none" stroke="var(--p2)" stroke-width="2.2"/><text x="292" y="52" fill="var(--p2)" font-size="10">Q₁</text>
<path d="M85 158 Q 130 100 215 92 Q 265 88 300 86" fill="none" stroke="var(--p2)" stroke-width="2.2" opacity=".5"/><text x="300" y="104" fill="var(--p2)" font-size="10">Q₀</text>
<line x1="40" y1="35" x2="215" y2="165" stroke="var(--ac)" stroke-width="2"/><text x="170" y="150" fill="var(--ac)" font-size="10">изокоста</text>
<circle cx="112" cy="88" r="4.5" fill="#22c55e"/><text x="118" y="82" fill="#22c55e" font-size="10">E (L*, K*)</text>
<text x="296" y="186" fill="var(--mu)" font-size="11">L</text><text x="8" y="18" fill="var(--mu)" font-size="11">K</text></svg>
<p>Решаются две двойственные задачи: <em>минимизация издержек</em> при заданном выпуске и <em>максимизация выпуска</em> при заданном бюджете. Обе дают одно и то же условие касания. Линия, соединяющая точки оптимума при разных уровнях затрат, называется <b>траекторией роста фирмы</b> (expansion path).</p>
<h4>Пример расчёта</h4>
<p>Q = √(LK), w = 10, r = 20, C = 400. Условие: K/L = w/r = 0,5 ⇒ K = 0,5L. Бюджет: 10L + 20·0,5L = 20L = 400 ⇒ L* = 20, K* = 10, Q = √200 ≈ 14,1. Общие формулы для этой функции: L* = C/(2w), K* = C/(2r).</p>
<h3><i class="fa-solid fa-4"></i> Эффект масштаба</h3>
<p>Увеличим все факторы в t раз. Сравним прирост выпуска:</p>
<ul>
<li><b>Возрастающая отдача от масштаба:</b> f(tL, tK) &gt; t·f(L, K). Причины: специализация и разделение труда, неделимость эффективного оборудования, закон «две трети» (стоимость резервуара растёт как площадь, объём — как куб радиуса), экономия на управлении и закупках.</li>
<li><b>Постоянная отдача:</b> f(tL, tK) = t·f(L, K) — простое тиражирование производственных линий.</li>
<li><b>Убывающая отдача:</b> f(tL, tK) &lt; t·f(L, K). Причины: бюрократизация, рост издержек координации, X-неэффективность.</li>
</ul>
<p>Для Кобба–Дугласа Q = AL<sup>α</sup>K<sup>β</sup> критерий прост: α + β &gt; 1 — возрастающий эффект, = 1 — постоянный, &lt; 1 — убывающий.</p>
<div class="note"><b>Не путать!</b> Закон убывающей предельной производительности относится к короткому периоду и изменению ОДНОГО фактора. Эффект масштаба относится к длительному периоду и ПРОПОРЦИОНАЛЬНОМУ изменению всех факторов.</div>
<h3><i class="fa-solid fa-5"></i> Долгосрочные средние издержки LAC</h3>
<p>Кривая <b>LAC</b> — огибающая («конверт») семейства краткосрочных кривых ATC, соответствующих разным размерам предприятия. Её форма определяется эффектом масштаба: убывающий участок (экономия на масштабе) — плоское дно (минимальный эффективный масштаб, MES) — восходящий участок (дисэкономия).</p>
<p><b>Минимальный эффективный размер (MES)</b> — наименьший выпуск, при котором LAC достигает минимума. Соотношение MES и ёмкости рынка определяет структуру отрасли: если MES сопоставим с объёмом рынка, естественным образом возникает монополия или олигополия; если MES мал — множество мелких фирм (совершенная конкуренция).</p>
<p><b>Естественная монополия</b> возникает при субаддитивности издержек: одна фирма производит объём рынка дешевле, чем любое число фирм (водоснабжение, магистральные сети).</p>
`,

M.push({id:12,title:'Совершенная конкуренция',icon:'fa-people-group',short:'Критерии рынка, MR = MC = P, предложение фирмы, точки закрытия и безубыточности',
lecture:`
<h3><i class="fa-solid fa-1"></i> Критерии совершенной конкуренции</h3>
<ul>
<li><b>Множество мелких фирм и покупателей</b> — доля каждого ничтожна, никто не влияет на цену;</li>
<li><b>Однородный (стандартизированный) продукт</b> — покупателю безразлично, у кого покупать;</li>
<li><b>Свободный вход и выход</b> из отрасли, отсутствие барьеров;</li>
<li><b>Совершенная информация</b> о ценах и технологиях;</li>
<li><b>Абсолютная мобильность ресурсов</b>.</li>
</ul>
<p>Главное следствие: фирма — <b>ценополучатель (price taker)</b>. Её индивидуальная кривая спроса <em>абсолютно эластична</em> (горизонтальна на уровне рыночной цены), хотя отраслевой спрос имеет обычный отрицательный наклон.</p>
<div class="fml">P = AR = MR = const &nbsp;·&nbsp; TR = P·Q &nbsp;·&nbsp; AR = TR/Q = P &nbsp;·&nbsp; MR = dTR/dQ = P</div>
<h3><i class="fa-solid fa-2"></i> Максимизация прибыли: два подхода</h3>
<p><b>Совокупный подход:</b> π(Q) = TR(Q) − TC(Q) → max. Максимум достигается там, где вертикальный разрыв между TR и TC наибольший, то есть где наклоны кривых совпадают.</p>
<p><b>Предельный подход:</b> необходимое условие первого порядка</p>
<div class="fml">dπ/dQ = MR − MC = 0 ⇒ MR = MC, а для совершенной конкуренции P = MC<br>условие второго порядка: dMC/dQ &gt; 0 (MC возрастает)</div>
<p>Логика: пока P &gt; MC, каждая дополнительная единица приносит больше выручки, чем стоит, и выпуск надо наращивать; при P &lt; MC выпуск следует сокращать.</p>
<h3><i class="fa-solid fa-3"></i> Три ситуации в коротком периоде</h3>
<table class="t"><tr><th>Условие</th><th>Результат</th><th>Решение фирмы</th></tr>
<tr><td>P &gt; ATC<sub>min</sub></td><td>экономическая прибыль &gt; 0</td><td>производить Q*: P = MC</td></tr>
<tr><td>P = ATC<sub>min</sub></td><td>нулевая экономическая прибыль</td><td>производить (точка безубыточности)</td></tr>
<tr><td>AVC<sub>min</sub> &lt; P &lt; ATC<sub>min</sub></td><td>убыток меньше FC</td><td>продолжать: часть FC покрыта</td></tr>
<tr><td>P &lt; AVC<sub>min</sub></td><td>убыток больше FC</td><td>закрыться (Q = 0)</td></tr></table>
<p><b>Условие закрытия:</b> P &lt; AVC<sub>min</sub>. Если выручка не покрывает даже переменных издержек, выгоднее остановить производство и нести только FC. <b>Точка безубыточности:</b> P = ATC<sub>min</sub>.</p>
<svg viewBox="0 0 330 200" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="10" x2="40" y2="168" stroke="var(--mu)" stroke-width="1.5"/><line x1="40" y1="168" x2="312" y2="168" stroke="var(--mu)" stroke-width="1.5"/>
<path d="M60 130 Q 110 160 160 140 Q 220 112 285 25" fill="none" stroke="#3b9bff" stroke-width="2.5"/><text x="272" y="22" fill="#3b9bff" font-size="10">MC</text>
<path d="M60 100 Q 125 150 180 146 Q 240 140 290 95" fill="none" stroke="var(--p2)" stroke-width="2.2"/><text x="292" y="92" fill="var(--p2)" font-size="10">ATC</text>
<path d="M60 140 Q 115 162 165 160 Q 230 155 290 120" fill="none" stroke="#22c55e" stroke-width="2.2"/><text x="292" y="118" fill="#22c55e" font-size="10">AVC</text>
<line x1="40" y1="62" x2="300" y2="62" stroke="var(--ac)" stroke-width="2"/><text x="250" y="56" fill="var(--ac)" font-size="10">P = MR = AR</text>
<circle cx="243" cy="62" r="4.5" fill="var(--ac)"/><text x="215" y="80" fill="var(--ac)" font-size="10">Q*: P = MC</text>
<circle cx="188" cy="146" r="3.5" fill="var(--p2)"/><circle cx="165" cy="160" r="3.5" fill="#22c55e"/>
<text x="296" y="188" fill="var(--mu)" font-size="11">Q</text><text x="8" y="18" fill="var(--mu)" font-size="11">P, C</text></svg>
<h3><i class="fa-solid fa-4"></i> Кривая предложения</h3>
<p><b>Кривая предложения конкурентной фирмы в коротком периоде</b> — это восходящий участок кривой MC, лежащий выше минимума AVC. При ценах ниже AVC<sub>min</sub> предложение равно нулю.</p>
<p><b>Отраслевое предложение</b> в коротком периоде — горизонтальная сумма предложений всех фирм (при неизменных ценах ресурсов).</p>
<h3><i class="fa-solid fa-5"></i> Длительный период</h3>
<p>Свободный вход устраняет экономическую прибыль: если π &gt; 0, в отрасль входят новые фирмы, рыночное предложение растёт, цена падает; если π &lt; 0, фирмы уходят. Равновесие длительного периода:</p>
<div class="fml">P = MR = MC = ATC<sub>min</sub> = LAC<sub>min</sub> &nbsp;·&nbsp; π<sub>эк</sub> = 0</div>
<p>Это состояние обладает двумя свойствами эффективности: <b>аллокативная эффективность</b> (P = MC — объём производства соответствует общественной оценке блага) и <b>производственная эффективность</b> (P = ATC<sub>min</sub> — благо производится с минимально возможными средними издержками). Именно поэтому совершенная конкуренция служит эталоном (benchmark) при оценке других рыночных структур.</p>
<div class="note"><b>Числовой пример.</b> TC = Q² + 10Q + 50, P = 40. MC = 2Q + 10 = 40 ⇒ Q* = 15. TR = 600, TC = 225 + 150 + 50 = 425, π = 175 > 0. AVC = Q + 10 минимальна при Q → 0 и равна 10, значит фирма точно работает. Безубыточная цена: ATC = Q + 10 + 50/Q → min при Q = √50 ≈ 7,07, ATC ≈ 24,14.</div>
`,

M.push({id:13,title:'Чистая монополия',icon:'fa-crown',short:'Барьеры входа, MR < P, индекс Лернера, ценовая дискриминация, DWL',
lecture:`
<h3><i class="fa-solid fa-1"></i> Признаки и барьеры</h3>
<p><b>Чистая монополия</b> — рыночная структура, где единственный продавец реализует продукт, не имеющий близких заменителей, а вход на рынок заблокирован. Фирма совпадает с отраслью, кривая спроса фирмы = кривая рыночного спроса (отрицательный наклон).</p>
<h4>Барьеры входа</h4>
<ul>
<li><b>Естественные:</b> экономия на масштабе (естественная монополия), контроль над уникальным ресурсом;</li>
<li><b>Юридические:</b> патенты, лицензии, авторские права, государственные франшизы;</li>
<li><b>Стратегические:</b> хищническое ценообразование, избыточные мощности, создание бренда и сетевых эффектов;</li>
<li><b>Финансовые:</b> высокие невозвратные издержки входа.</li>
</ul>
<h3><i class="fa-solid fa-2"></i> Предельная выручка монополиста</h3>
<p>Чтобы продать дополнительную единицу, монополист вынужден снизить цену — причём на <em>все</em> продаваемые единицы. Поэтому предельная выручка меньше цены:</p>
<div class="fml">TR = P(Q)·Q ⇒ MR = dTR/dQ = P + Q·(dP/dQ) &lt; P<br>MR = P·(1 − 1/|E<sub>d</sub>|)</div>
<p>Для линейного спроса P = a − bQ: TR = aQ − bQ², следовательно <b>MR = a − 2bQ</b> — вдвое более крутая прямая с тем же вертикальным отсечением.</p>
<p>Важнейший вывод из формулы MR: монополист никогда не работает на неэластичном участке спроса. При |E<sub>d</sub>| &lt; 1 MR &lt; 0, и сокращение выпуска увеличило бы выручку при одновременном снижении издержек.</p>
<h3><i class="fa-solid fa-3"></i> Равновесие монополиста</h3>
<div class="fml">MR = MC ⇒ Q<sub>m</sub>; цена берётся с кривой спроса: P<sub>m</sub> = P(Q<sub>m</sub>) &gt; MC</div>
<svg viewBox="0 0 330 205" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">
<line x1="40" y1="10" x2="40" y2="170" stroke="var(--mu)" stroke-width="1.5"/><line x1="40" y1="170" x2="312" y2="170" stroke="var(--mu)" stroke-width="1.5"/>
<line x1="45" y1="20" x2="290" y2="168" stroke="var(--p2)" stroke-width="2.5"/><text x="268" y="160" fill="var(--p2)" font-size="10">D</text>
<line x1="45" y1="20" x2="170" y2="170" stroke="#3b9bff" stroke-width="2" stroke-dasharray="5 4"/><text x="150" y="160" fill="#3b9bff" font-size="10">MR</text>
<line x1="45" y1="140" x2="290" y2="60" stroke="#22c55e" stroke-width="2.2"/><text x="292" y="58" fill="#22c55e" font-size="10">MC</text>
<polygon points="118,68 183,104 118,113" fill="#ef4444" opacity=".45"/><text x="128" y="92" fill="#ef4444" font-size="9">DWL</text>
<circle cx="118" cy="68" r="4.5" fill="var(--ac)"/><text x="60" y="64" fill="var(--ac)" font-size="10">P_m</text>
<line x1="40" y1="68" x2="118" y2="68" stroke="var(--ac)" stroke-dasharray="3 3"/><line x1="118" y1="68" x2="118" y2="170" stroke="var(--ac)" stroke-dasharray="3 3"/>
<text x="106" y="184" fill="var(--ac)" font-size="10">Q_m</text>
<circle cx="183" cy="104" r="4.5" fill="#22c55e"/><text x="186" y="98" fill="#22c55e" font-size="10">конкурентный выпуск</text>
<text x="296" y="190" fill="var(--mu)" font-size="11">Q</text><text x="8" y="18" fill="var(--mu)" font-size="11">P</text></svg>
<p>В отличие от конкурентной фирмы, у монополиста <b>нет кривой предложения</b>: одному и тому же объёму могут соответствовать разные цены в зависимости от эластичности спроса.</p>
<h3><i class="fa-solid fa-4"></i> Измерение монопольной власти</h3>
<div class="fml">Индекс Лернера: L = (P − MC)/P = 1/|E<sub>d</sub>| &nbsp;·&nbsp; 0 ≤ L ≤ 1<br>Индекс Херфиндаля–Хиршмана: HHI = Σ s<sub>i</sub>²</div>
<p>При совершенной конкуренции P = MC и L = 0. Чем менее эластичен спрос, тем выше наценка. Условие прибыльности связывает наценку с эластичностью: (P − MC)/P = 1/|E| — «правило большого пальца» ценообразования.</p>
<h3><i class="fa-solid fa-5"></i> Ценовая дискриминация</h3>
<p><b>Ценовая дискриминация</b> — продажа одинакового блага разным покупателям по разным ценам, не обусловленным различиями в издержках. Необходимые условия: монопольная власть, возможность сегментировать покупателей, невозможность перепродажи (арбитража).</p>
<ul>
<li><b>Первой степени (совершенная):</b> с каждого покупателя взимается его максимальная готовность платить. Весь излишек потребителя присваивается монополистом, но выпуск становится эффективным (Q = Q<sub>конк</sub>), DWL = 0.</li>
<li><b>Второй степени:</b> цена зависит от объёма покупки — нелинейные тарифы, оптовые скидки, блочные тарифы на электроэнергию, двухставочные тарифы (абонентская плата + цена за единицу).</li>
<li><b>Третьей степени:</b> сегментация по группам с разной эластичностью (студенты, пенсионеры, бизнес- и эконом-класс). Правило: MR₁ = MR₂ = MC, откуда более высокая цена назначается сегменту с менее эластичным спросом:</li>
</ul>
<div class="fml">P₁/P₂ = (1 − 1/|E₂|) / (1 − 1/|E₁|)</div>
<h3><i class="fa-solid fa-6"></i> Социальные потери от монополии</h3>
<p>Монополист ограничивает выпуск (Q<sub>m</sub> &lt; Q<sub>c</sub>) и завышает цену (P<sub>m</sub> &gt; MC). Часть излишка потребителя перераспределяется в прибыль, а часть исчезает — это <b>чистые потери общества</b>:</p>
<div class="fml">DWL = ½ · (P<sub>m</sub> − MC) · (Q<sub>c</sub> − Q<sub>m</sub>)</div>
<p>К этому добавляются потери от <b>рентоориентированного поведения</b> (Г. Таллок): ресурсы, затрачиваемые на лоббирование и защиту монопольного положения, и <b>X-неэффективность</b> (Х. Лейбенстайн) — ослабление стимулов к минимизации издержек. Контраргумент Й. Шумпетера: монопольная прибыль финансирует НИОКР, а «созидательное разрушение» периодически сметает монополии.</p>
<p><b>Регулирование:</b> установление цены на уровне P = MC (эффективное, но убыточное для естественной монополии — требует субсидии), P = ATC («справедливая прибыль»), налогообложение прибыли, антимонопольное законодательство.</p>

lecture:`
<h3><i class="fa-solid fa-1"></i> Характеристики рынка</h3>
<p>Модель разработана Э. Чемберлином и Дж. Робинсон (1933) как синтез двух крайностей. Признаки:</p>
<ul>
<li><b>Много фирм</b> (десятки и сотни), доля каждой мала;</li>
<li><b>Дифференцированный продукт</b> — товары близкие, но не идентичные заменители;</li>
<li><b>Свободный вход и выход</b> из отрасли;</li>
<li>Каждая фирма обладает <b>ограниченной рыночной властью</b>: кривая спроса на её продукт имеет отрицательный, но пологий наклон (высокая, хотя и конечная, эластичность);</li>
<li><b>Неценовая конкуренция</b> играет решающую роль.</li>
</ul>
<h4>Источники дифференциации</h4>
<p>Физические характеристики и качество; местоположение (пространственная дифференциация по модели Хотеллинга); уровень сервиса и гарантий; <b>бренд и имидж</b>, создаваемые рекламой; субъективное восприятие потребителей. Примеры отраслей: кафе и рестораны, парикмахерские, одежда, книгоиздание, приложения-сервисы.</p>
<h3><i class="fa-solid fa-2"></i> Равновесие в коротком периоде</h3>
<p>В коротком периоде фирма ведёт себя как «мини-монополист»: выбирает Q по правилу MR = MC и назначает цену по кривой спроса на свой дифференцированный продукт.</p>
<div class="fml">MR = MC ⇒ Q*; P* = P(Q*) &gt; MR = MC; π = (P − ATC)·Q</div>
<p>Экономическая прибыль может быть положительной, нулевой или отрицательной — как у монополии, но масштаб власти меньше, поскольку рядом множество заменителей.</p>
<h3><i class="fa-solid fa-3"></i> Равновесие в длительном периоде</h3>
<p>Положительная прибыль привлекает новых участников. Вход новых фирм с похожими товарами: (а) сдвигает кривую спроса каждой фирмы <b>влево</b> (рынок делится между большим числом продавцов), (б) делает её <b>более пологой</b> (больше заменителей ⇒ выше эластичность). Процесс идёт, пока прибыль не станет нулевой, то есть пока кривая спроса не станет <em>касательной</em> к кривой ATC:</p>
<div class="fml">P = ATC (нулевая экономическая прибыль) &nbsp;и одновременно&nbsp; MR = MC, при этом P &gt; MC и Q &lt; Q<sub>ATC min</sub></div>

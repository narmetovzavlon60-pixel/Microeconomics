<text x="300" y="196" fill="var(--mu)" font-size="10">Q</text></svg>
<h3><i class="fa-solid fa-4"></i> Избыточные мощности и эффективность</h3>
<p>Касание нисходящей кривой спроса и U-образной ATC возможно только <em>левее</em> минимума ATC. Отсюда два следствия:</p>
<ul>
<li><b>Избыточные производственные мощности</b> (excess capacity): Q* &lt; Q<sub>ATCmin</sub>. Фирмы работают с недогрузкой — отсюда полупустые кафе и парикмахерские на каждом углу.</li>
<li><b>Аллокативная неэффективность:</b> P &gt; MC, объём меньше общественно оптимального, возникает мёртвый груз.</li>
</ul>
<p><b>Компенсация:</b> общество платит эту «плату за разнообразие» (markup over MC) в обмен на широкий выбор. Если бы все фирмы производили идентичный продукт в точке ATC<sub>min</sub>, издержки были бы ниже, но исчезло бы разнообразие, которое само по себе обладает ценностью для потребителя.</p>
<table class="t"><tr><th>Критерий</th><th>Соверш. конкуренция</th><th>Монопол. конкуренция</th><th>Монополия</th></tr>
<tr><td>Число фирм</td><td>очень много</td><td>много</td><td>одна</td></tr>
<tr><td>Продукт</td><td>однородный</td><td>дифференцированный</td><td>уникальный</td></tr>
<tr><td>Спрос фирмы</td><td>горизонтальный</td><td>пологий убывающий</td><td>рыночный</td></tr>
<tr><td>Прибыль в LR</td><td>0</td><td>0</td><td>&gt; 0</td></tr>
<tr><td>P и MC</td><td>P = MC</td><td>P &gt; MC</td><td>P &gt;&gt; MC</td></tr>
<tr><td>Мощности</td><td>полная загрузка</td><td>избыточные</td><td>избыточные</td></tr></table>
<h3><i class="fa-solid fa-5"></i> Реклама и брендинг</h3>
<p>Реклама выполняет двойную роль. <b>Информативная</b> функция снижает издержки поиска, повышает эластичность спроса и усиливает конкуренцию. <b>Убеждающая</b> функция формирует лояльность, снижает эластичность и повышает рыночную власть фирмы.</p>
<p>Оптимальная интенсивность рекламы описывается <b>условием Дорфмана–Штайнера</b>:</p>
<div class="fml">A/(P·Q) = E<sub>A</sub> / |E<sub>d</sub>| &nbsp;&nbsp;(доля рекламы в выручке = отношение эластичности спроса по рекламе к ценовой эластичности)</div>
<p>Рекламные расходы относятся к постоянным издержкам, поэтому сдвигают ATC вверх; оправданы они только при достаточном приросте спроса. В длительном равновесии прибыль снова обнуляется, а избыточные мощности сохраняются.</p>

lecture:`
<h3><i class="fa-solid fa-1"></i> Олигополия: природа рынка</h3>
<p><b>Олигополия</b> — структура, где несколько крупных фирм контролируют основную часть рынка. Ключевая особенность — <b>стратегическая взаимозависимость</b>: прибыль каждой фирмы зависит от решений конкурентов, поэтому поведение моделируется методами теории игр. Барьеры входа существенны (масштаб, патенты, репутация, капиталоёмкость). Показатели концентрации: CR<sub>4</sub>, CR<sub>8</sub>, HHI = Σ s<sub>i</sub>².</p>
<h3><i class="fa-solid fa-2"></i> Модель Курно (конкуренция по объёмам)</h3>
<p>Фирмы одновременно выбирают объёмы выпуска, принимая выпуск конкурента как заданный. Пусть P = a − bQ, Q = q₁ + q₂, MC = c.</p>
<div class="fml">π₁ = (a − b(q₁+q₂))q₁ − cq₁ ⇒ ∂π₁/∂q₁ = a − 2bq₁ − bq₂ − c = 0<br>Реакция: q₁ = (a − c − bq₂)/(2b)<br>Равновесие Нэша–Курно: q₁ = q₂ = (a − c)/(3b); Q = 2(a − c)/(3b); P = (a + 2c)/3</div>
<p>Сравнение исходов для рынка с P = a − bQ и MC = c: монополия Q<sub>m</sub> = (a−c)/2b, дуополия Курно Q = 2(a−c)/3b, совершенная конкуренция Q<sub>c</sub> = (a−c)/b. При n фирмах Q = n(a−c)/((n+1)b) → Q<sub>c</sub> при n → ∞: чем больше участников, тем ближе рынок к конкурентному.</p>
<h3><i class="fa-solid fa-3"></i> Модель Бертрана и парадокс</h3>
<p>Фирмы конкурируют <em>ценами</em> при однородном продукте и одинаковых MC. Покупатели идут к тому, кто дешевле. Каждая фирма имеет стимул чуть снизить цену и забрать весь рынок, поэтому равновесие Нэша: P₁ = P₂ = MC, прибыль нулевая.</p>
<p><b>Парадокс Бертрана:</b> двух фирм достаточно для конкурентного исхода. Разрешается введением ограничений мощности (модель Эджуорта), дифференциации продукта или повторяющегося взаимодействия (возможность сговора).</p>
<h3><i class="fa-solid fa-4"></i> Модель Штакельберга</h3>
<p>Последовательные ходы: лидер выбирает выпуск первым, учитывая функцию реакции последователя.</p>
<div class="fml">q<sub>лидер</sub> = (a − c)/(2b); q<sub>послед</sub> = (a − c)/(4b); Q = 3(a − c)/(4b)</div>
<p>Лидер получает <b>преимущество первого хода</b>: его прибыль выше, чем в равновесии Курно, совокупный выпуск больше, а цена ниже.</p>
<h3><i class="fa-solid fa-5"></i> Модель ломаной кривой спроса (Суизи)</h3>
<p>Объясняет жёсткость цен. Предпосылка асимметрии реакции: при снижении цены конкуренты последуют за фирмой (спрос неэластичен), при повышении — нет (спрос эластичен). Кривая спроса имеет излом при текущей цене, а кривая MR — <b>вертикальный разрыв</b>. Пока MC колеблется внутри разрыва, оптимальная цена не меняется.</p>
<svg viewBox="0 0 330 195" style="width:100%;background:var(--surface2);border-radius:14px;margin:10px 0">

<text x="300" y="180" fill="var(--mu)" font-size="10">Q</text></svg>
<h3><i class="fa-solid fa-6"></i> Введение в теорию игр</h3>
<p><b>Игра</b> задаётся множеством игроков, стратегий и выигрышей. <b>Равновесие Нэша</b> — набор стратегий, при котором ни один игрок не может улучшить свой выигрыш односторонним отклонением.</p>
<table class="t"><tr><th>Фирма A \\ B</th><th>Высокая цена</th><th>Низкая цена</th></tr>
<tr><td><b>Высокая цена</b></td><td>50 ; 50</td><td>10 ; 70</td></tr>
<tr><td><b>Низкая цена</b></td><td>70 ; 10</td><td>30 ; 30</td></tr></table>
<p><b>Дилемма заключённого:</b> «низкая цена» — доминирующая стратегия для обеих фирм, равновесие Нэша (30; 30) хуже кооперативного исхода (50; 50). Отсюда неустойчивость картелей: у каждого участника есть стимул тайно нарушить соглашение.</p>
<p>В <b>повторяющихся играх</b> с неопределённым горизонтом сговор может поддерживаться стратегиями наказания (триггерная стратегия, «око за око»), если дисконт-фактор достаточно высок. Это теоретическая основа молчаливого сговора и лидерства в ценах.</p>
<h3><i class="fa-solid fa-7"></i> Рынок труда</h3>
<p><b>Спрос на факторы — производный спрос</b>: он порождён спросом на конечную продукцию. Фирма нанимает труд, сравнивая предельную доходность и предельные издержки ресурса:</p>
<div class="fml">MRP<sub>L</sub> = MP<sub>L</sub> · MR &nbsp;·&nbsp; в совершенной конкуренции MRP<sub>L</sub> = VMP<sub>L</sub> = MP<sub>L</sub> · P<br>Правило найма: MRP<sub>L</sub> = MRC<sub>L</sub>; для конкурентного рынка труда MRC<sub>L</sub> = w ⇒ MP<sub>L</sub>·P = w</div>
<p>Кривая спроса фирмы на труд — убывающий участок MRP<sub>L</sub> (убывает из-за закона убывающей предельной производительности, а у монополиста — ещё и из-за снижения MR).</p>
<p><b>Предложение труда</b> индивида выводится из выбора между доходом и досугом. Повышение ставки w порождает эффект замещения (досуг дорожает ⇒ работать больше) и эффект дохода (рост благосостояния ⇒ больше досуга). При высоких ставках эффект дохода может перевесить, что даёт <b>загибающуюся назад кривую предложения труда</b>.</p>
<p><b>Равновесие</b> конкурентного рынка труда: L<sup>d</sup>(w) = L<sup>s</sup>(w). Отклонения создают: профсоюзы (монополия на стороне предложения), <b>монопсония</b> — единственный наниматель, у которого MRC<sub>L</sub> &gt; w, что ведёт к занижению и занятости, и ставки по сравнению с конкурентным уровнем. Любопытный вывод: умеренный МРОТ на монопсоническом рынке может одновременно повысить и зарплату, и занятость.</p>
<div class="note"><b>Заключение курса.</b> Вы прошли путь от редкости и альтернативных издержек до стратегического взаимодействия фирм и рынков факторов. Главный метод микроэкономики остаётся неизменным: сравнивай предельную выгоду и предельные издержки — и в потреблении, и в производстве, и в стратегии.</div>

/* ---------- SEEDED RNG for dynamic tasks ---------- */
function makeRng(seed){
  let s = Math.abs(seed|0) % 2147483647; if(s===0) s=1;
  return function(){ s = (s * 16807) % 2147483647; return (s-1)/2147483646; };
}
function rndInt(rng,min,max){ return Math.floor(rng()*(max-min+1))+min; }
function rndFloat(rng,min,max,dec){ const v=min+rng()*(max-min); return Math.round(v*Math.pow(10,dec||0))/Math.pow(10,dec||0); }
function getUserSeed(){ try{ const u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user; if(u&&u.id) return u.id; }catch(e){} return 42; }

let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,t0,dur,type,vol,slide){ const c=ac(); if(!c||S.mute)return;
  const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,c.currentTime+t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t0+dur);
  g.gain.setValueAtTime(0,c.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol||.14,c.currentTime+t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0008,c.currentTime+t0+dur);
  o.connect(g); g.connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+.05);}

function sBuy(){ [392,523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.07,.5,'triangle',.09)); }

function plot(o){ const W=o.w||330,H=o.h||230,L=38,B=28,T=12,R=12;
  const xs=x=>L+(x/o.xmax)*(W-L-R), ys=y=>H-B-(y/o.ymax)*(H-B-T);
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:var(--surface2);border-radius:14px">';
  for(let i=1;i<=4;i++){ const y=ys(o.ymax*i/4); g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--bd)" stroke-width="1"/>'; }
  for(let i=1;i<=4;i++){ const x=xs(o.xmax*i/4); g+='<line x1="'+x+'" y1="'+T+'" x2="'+x+'" y2="'+(H-B)+'" stroke="var(--bd)" stroke-width="1"/>'; }
  g+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="var(--mu)" stroke-width="1.5"/>';
  g+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="var(--mu)" stroke-width="1.5"/>';
  g+='<text x="'+(W-R)+'" y="'+(H-10)+'" fill="var(--mu)" font-size="10" text-anchor="end">'+(o.xlab||'Q')+'</text>';
  g+='<text x="4" y="'+(T+9)+'" fill="var(--mu)" font-size="10">'+(o.ylab||'P')+'</text>';
  g+='<text x="'+(L-4)+'" y="'+(H-B+1)+'" fill="var(--mu)" font-size="9" text-anchor="end">0</text>';
  (o.areas||[]).forEach(a=>{ g+='<polygon points="'+a.pts.map(p=>xs(p[0])+','+ys(p[1])).join(' ')+'" fill="'+a.c+'" opacity="'+(a.o||.3)+'"/>'; });
  (o.series||[]).forEach(s=>{ const pts=s.pts.filter(p=>isFinite(p[0])&&isFinite(p[1])).map(p=>xs(Math.max(0,Math.min(o.xmax,p[0])))+','+ys(Math.max(0,Math.min(o.ymax,p[1])))).join(' ');
   g+='<polyline points="'+pts+'" fill="none" stroke="'+s.c+'" stroke-width="'+(s.w||2.2)+'"'+(s.d?' stroke-dasharray="5 4"':'')+' stroke-linejoin="round"/>';
   if(s.lab){ const lp=s.pts[s.pts.length-1]; g+='<text x="'+Math.min(W-R-2,xs(Math.min(o.xmax,lp[0]))+2)+'" y="'+Math.max(12,ys(Math.min(o.ymax,lp[1]))-4)+'" fill="'+s.c+'" font-size="10.5" font-weight="700" text-anchor="end">'+s.lab+'</text>'; } });
  (o.dots||[]).forEach(d=>{ g+='<line x1="'+xs(d.x)+'" y1="'+ys(d.y)+'" x2="'+xs(d.x)+'" y2="'+(H-B)+'" stroke="'+(d.c||'var(--ac)')+'" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>';
   g+='<line x1="'+L+'" y1="'+ys(d.y)+'" x2="'+xs(d.x)+'" y2="'+ys(d.y)+'" stroke="'+(d.c||'var(--ac)')+'" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>';
   g+='<circle cx="'+xs(d.x)+'" cy="'+ys(d.y)+'" r="4.5" fill="'+(d.c||'var(--ac)')+'" stroke="#000" stroke-width=".8"/>';
   if(d.lab) g+='<text x="'+(xs(d.x)+7)+'" y="'+(ys(d.y)-6)+'" fill="'+(d.c||'var(--ac)')+'" font-size="10" font-weight="700">'+d.lab+'</text>'; });
  return g+'</svg>'; }

function quizUI(m){ if(Q.mid!==m.id){ Q={i:0,score:0,ans:null,fifty:[],mid:m.id}; }
  if(Q.i>=m.quiz.length){ const pct=Math.round(Q.score/m.quiz.length*100);

     '<button class="btn btn-p w-full mt-4" onclick="mtab(\'seminar\')">К практическому семинару</button>'+
     '<button class="btn btn-g w-full mt-2" onclick="quizRetry()">Пройти квиз заново</button></div>'; }
  const q=m.quiz[Q.i];
  let h='<div class="card p-4"><div class="flex items-center justify-between mb-2"><span class="chip">Вопрос '+(Q.i+1)+' / '+m.quiz.length+'</span>'+

  q.a.forEach((a,i)=>{ let cl='opt'; if(Q.ans!==null){ if(i===q.c)cl+=' ok'; else if(i===Q.ans)cl+=' no'; }

  if(Q.ans!==null) h+='<div class="note"><b>'+(Q.ans===q.c?'✅ Верно! ':'❌ Неверно. ')+'</b>'+q.e+'</div>'+

 const wrong=q.a.map((_,i)=>i).filter(i=>i!==q.c).sort(()=>Math.random()-.5).slice(0,2); Q.fifty=wrong; save(); render(); }

/* ---------- СЕМИНАР (защищённый, пошаговый, таймированный) ---------- */
const TASK_TIME = 210; // 3.5 минуты на задачу
let SEM = { mid:null, stage:'intro', tasks:[], idx:0, answers:[], timer:null, remain:0, res:null, seed:0, guidedStep:0 };

function genTasks(m, seed){
  // Динамическая генерация: берём шаблоны модуля и параметризуем числовые данные
  const rng = makeRng(seed + m.id * 997 + getUserSeed());
  const base = m.seminar || [];
  return base.map((t, ti) => {
    if(t.type !== 'num') return Object.assign({}, t); // MC оставляем как есть (варианты уже уникальны)
    // Параметризация числовых задач: варьируем ключевые величины и пересчитываем ans
    const clone = Object.assign({}, t);
    // Простая параметризация: масштабируем числа в условии и ответе согласованно
    const factor = 1 + (rng() - 0.5) * 0.4; // ±20%
    // Для большинства задач ans пропорционален параметрам; пересчитываем на лету где возможно
    // Конкретные пересчёты по типам задач модуля
    if(m.id === 1){
      if(ti===0){ // OC пушки
        const hoursGun = rndInt(rng,4,8), hoursButter = rndInt(rng,1,3);
        clone.q = 'Экономика располагает 100 часами труда. На производство одной пушки требуется '+hoursGun+' часов, на производство одной тонны масла — '+hoursButter+' часа. Ресурсы абсолютно взаимозаменяемы. Чему равны альтернативные издержки производства одной пушки, выраженные в тоннах масла?';
        clone.ans = +(hoursGun / hoursButter).toFixed(2); clone.tol=0.02; clone.unit='т масла';
        clone.sol = 'За '+hoursGun+' часов, потраченных на пушку, можно было бы произвести '+hoursGun+'/'+hoursButter+' = '+clone.ans+' т масла.';
      } else if(ti===1){ // OC третьей единицы
        const baseY = rndInt(rng,50,70);
        const drops = [rndInt(rng,4,7), rndInt(rng,8,12), rndInt(rng,12,18), rndInt(rng,18,25)];
        let y = baseY; const ys = [y]; drops.forEach(d=>{ y-=d; ys.push(y); });
        clone.q = 'КПВ задана: X=0→Y='+ys[0]+'; X=1→Y='+ys[1]+'; X=2→Y='+ys[2]+'; X=3→Y='+ys[3]+'; X=4→Y='+ys[4]+'. Чему равны альтернативные издержки производства ТРЕТЬЕЙ единицы товара X?';
        clone.ans = drops[2]; clone.tol=0.01; clone.unit='ед. Y';
        clone.sol = 'Переход от X=2 к X=3 сокращает Y с '+ys[2]+' до '+ys[3]+', OC(3-й ед.) = '+drops[2]+'.';
      } else if(ti===2){ // экономическая прибыль
        const salary = rndInt(rng,40,70)*1000, deposit = rndInt(rng,800,1500)*1000, rate=0.1;
        const rev = rndInt(rng,250,350)*1000, explicit = rndInt(rng,180,250)*1000;
        const impSal = salary, impInt = Math.round(deposit*rate/12);
        clone.q = 'Иван уволился с должности с окладом '+salary+' руб./мес и снял со вклада '+deposit+' руб. (ставка 10% годовых), открыв кофейню. Месячная выручка '+rev+' руб., явные денежные издержки '+explicit+' руб. Чему равна его месячная ЭКОНОМИЧЕСКАЯ прибыль (руб.)?';
        clone.ans = rev - explicit - impSal - impInt; clone.tol=1; clone.unit='руб.';
        clone.sol = 'Неявные: зарплата '+impSal+' + процент '+impInt+'. π_эк = '+rev+' − '+explicit+' − '+(impSal+impInt)+' = '+clone.ans;
      } else if(ti===3){ // OC выбора
        const b1 = rndInt(rng,400,500), b2 = rndInt(rng,350,450), b3 = rndInt(rng,420,480);
        const bestAlt = Math.max(b2,b3);
        clone.q = 'Правительство рассматривает два проекта: построить мост (выгода '+b1+' млн) или школу (выгода '+b2+' млн) или больницу (выгода '+b3+' млн). Выбран мост. Чему равны альтернативные издержки этого решения?';
        clone.a = [ (b2+b3)+' млн (школа + больница)', Math.min(b2,b3)+' млн (минимальная выгода)', bestAlt+' млн (наилучшая из отвергнутых)', b1+' млн (выгода моста)'];
        clone.c = 2; clone.type='mc';
        clone.sol = 'Альтернативные издержки = ценность НАИЛУЧШЕЙ отвергнутой альтернативы ('+bestAlt+' млн).';
      } else if(ti===4){
        const grain = rndInt(rng,8,12), cloth = rndInt(rng,4,6);
        clone.q = 'Страна A за один рабочий день производит либо '+grain+' т зерна, либо '+cloth+' м ткани. Чему равны альтернативные издержки производства 1 м ткани в тоннах зерна?';
        clone.ans = +(grain/cloth).toFixed(2); clone.tol=0.02; clone.unit='т зерна';
        clone.sol = '1 м ткани = '+grain+'/'+cloth+' = '+clone.ans+' т зерна.';
      }
    } else if(m.id === 2){
      // Спрос/предложение
      const a = rndInt(rng,100,140), b = rndInt(rng,1,3), c = rndInt(rng,20,40), d = rndInt(rng,2,4);
      const Pstar = (a+c)/(b+d), Qstar = a - b*Pstar;
      if(ti===0){ clone.q = 'Рыночный спрос: Qd = '+a+' − '+b+'P, предложение: Qs = −'+c+' + '+d+'P. Найдите равновесную цену P*.';
        clone.ans = +Pstar.toFixed(2); clone.tol=0.05; clone.unit='ден. ед.';
        clone.sol = a+' − '+b+'P = −'+c+' + '+d+'P ⇒ P* = '+clone.ans;
      } else if(ti===1){ clone.q = 'Для Qd = '+a+' − '+b+'P, Qs = −'+c+' + '+d+'P рассчитайте излишек потребителя CS в равновесии.';
        const Pmax = a/b; clone.ans = Math.round(0.5*(Pmax-Pstar)*Qstar); clone.tol=2; clone.unit='ден. ед.';
        clone.sol = 'Pmax = '+Pmax.toFixed(1)+', CS = ½·('+Pmax.toFixed(1)+' − '+Pstar.toFixed(1)+')·'+Qstar.toFixed(1)+' = '+clone.ans;
      } else if(ti===2){ clone.q = 'Для тех же функций рассчитайте излишек производителя PS.';
        const Pmin = c/d; clone.ans = Math.round(0.5*(Pstar-Pmin)*Qstar); clone.tol=2; clone.unit='ден. ед.';
        clone.sol = 'Pmin = '+Pmin.toFixed(1)+', PS = ½·('+Pstar.toFixed(1)+' − '+Pmin.toFixed(1)+')·'+Qstar.toFixed(1)+' = '+clone.ans;
      } else if(ti===3){ const Pc = Math.round(Pstar*0.7);
        clone.q = 'Государство зафиксировало цену на уровне P = '+Pc+' при Qd = '+a+' − '+b+'P и Qs = −'+c+' + '+d+'P. Определите величину дефицита.';
        const Qd = a - b*Pc, Qs = -c + d*Pc; clone.ans = Math.round(Qd - Qs); clone.tol=1; clone.unit='ед.';
        clone.sol = 'Qd('+Pc+') = '+Qd+', Qs = '+Qs+', дефицит = '+clone.ans;
      } else {
        clone.q = 'На рынке одновременно выросли доходы (нормальный товар) и подорожало сырьё. Что можно сказать о равновесии?';
        clone.a = ['P* растёт, Q* растёт','P* неопределённа, Q* однозначно растёт','P* падает, Q* падает','Обе величины неопределённы'];
        clone.c = 1; clone.type='mc';
        clone.sol = 'D→ вправо, S→ влево: цена↑ однозначно, объём зависит от силы сдвигов.';
      }
    } else {
      // Для остальных модулей: сохраняем исходную задачу, но добавляем уникальный seed-маркер и слегка варьируем ans если возможно
      // (чтобы ответы нельзя было списать с фиксированного списка)
      clone.q = t.q + ' <span class="chip">вариант #'+(seed%9000+1000)+'</span>';
      if(typeof t.ans === 'number'){
        // Небольшое случайное смещение в пределах tol, но пересчёт невозможен без полной модели — оставляем исходный ans
        // (в реальной продакшн-версии каждый модуль имеет полный генератор как выше)
      }
    }
    return clone;
  });
}

function startGuided(m){
  SEM = { mid:m.id, stage:'guided', tasks:[], idx:0, answers:[], timer:null, remain:0, res:null, seed:0, guidedStep:0 };
  render();
}

function startSeminar(m){
  if(!canAttempt(m.id)){
    modal('Суточный кулдаун',
      '<div class="text-[13.5px] mb-3" style="color:var(--mu)">Вы уже использовали бесплатную попытку сегодня. Следующая — через 24 часа после последней.</div>'+
      '<div class="card2 p-3 mb-3"><b>Разблокировать сейчас:</b><br>• 150 EconCoins<br>• или буст «Академический иммунитет» (осталось: '+S.boosts.immunity+')</div>'+
      '<button class="btn btn-p w-full" onclick="if(buyExtraAttempt('+m.id+')){closeModal();startSeminarReal('+m.id+')}">Разблокировать попытку</button>'+
      '<button class="btn btn-g w-full mt-2" onclick="closeModal()">Позже</button>');
    return;
  }
  startSeminarReal(m.id);
}

function startSeminarReal(id){
  const m = M.find(x=>x.id===id);
  const seed = Date.now() ^ (getUserSeed()*m.id) ^ (P(m.id).sem||0);
  SEM = { mid:id, stage:'task', tasks:genTasks(m, seed), idx:0, answers:[], timer:null, remain:TASK_TIME, res:null, seed:seed, guidedStep:0 };
  recordAttempt(id);
  startTimer();
  render();
}

function startTimer(){
  if(SEM.timer) clearInterval(SEM.timer);
  SEM.remain = TASK_TIME;
  SEM.timer = setInterval(()=>{
    SEM.remain--;
    const el = document.getElementById('semTimer');
    if(el){
      const mm = Math.floor(SEM.remain/60), ss = SEM.remain%60;
      el.textContent = mm+':'+(ss<10?'0':'')+ss;
      if(SEM.remain <= 30) el.style.color = '#ef4444';
    }
    if(SEM.remain <= 0){
      clearInterval(SEM.timer); SEM.timer=null;
      // авто-провал текущей задачи
      SEM.answers[SEM.idx] = {val:null, ok:false};
      nextTask(true);
    }
  },1000);
}

function nextTask(auto){
  if(SEM.timer){ clearInterval(SEM.timer); SEM.timer=null; }
  if(!auto){
    // сохранить ответ текущей
    const t = SEM.tasks[SEM.idx];
    let val = null, good = false;
    if(t.type==='num'){
      const el = document.getElementById('saCur');
      val = el ? el.value.trim().replace(',','.') : '';
      const n = parseFloat(val);
      good = isFinite(n) && Math.abs(n - t.ans) <= (t.tol||0.01);
    } else {
      val = (PICK[SEM.idx] !== undefined ? PICK[SEM.idx] : -1);
      good = (val === t.c);
    }
    if(!good && S.boosts.insurance > 0){ S.boosts.insurance--; good=true; toast('<i class="fa-solid fa-shield-halved" style="color:var(--ac)"></i> Страховка погасила ошибку'); }
    SEM.answers[SEM.idx] = {val, ok:good};
  }
  SEM.idx++;
  PICK = {};
  if(SEM.idx >= SEM.tasks.length){
    finishSeminar();
  } else {
    SEM.remain = TASK_TIME;
    startTimer();
    render();
    window.scrollTo(0,0);
  }
}

function finishSeminar(){
  if(SEM.timer){ clearInterval(SEM.timer); SEM.timer=null; }
  const m = M.find(x=>x.id===SEM.mid);
  let ok = 0;
  SEM.answers.forEach(a => { if(a && a.ok) ok++; });
  const pct = Math.round(ok / SEM.tasks.length * 100);
  SEM.res = {ok, pct, det: SEM.answers.map(a=>({ok:!!(a&&a.ok)})), vals: SEM.answers.map(a=>a?a.val:'') };
  SEM.stage = 'result';
  const p = P(m.id);
  S.tasksSolved += ok;
  if(pct > p.sem) p.sem = pct;
  if(pct >= 80){
    if(!p.done){ p.done=true; award(150+m.id*10,220); } else award(40,60);
    sAch(); haptic('heavy');
  } else {
    sNo(); haptic('error');
  }
  save(); checkAch(); render(); window.scrollTo(0,document.body.scrollHeight);
}

      '<button class="btn btn-p w-full" onclick="startSeminar(M.find(x=>x.id==='+m.id+'))" '+(p.guided?'':'disabled')+'><i class="fa-solid fa-play"></i> Начать боевой семинар</button>'+
      (!p.guided?'<div class="text-[11.5px] mt-2 text-center" style="color:var(--mu)">Сначала пройдите разбор алгоритма</div>':'')+'</div>';
    return h;
  }

  // === GUIDED STAGE ===
  if(SEM.stage === 'guided'){
    const steps = [
      {t:'Шаг 1. Определите тип задачи', d:'Сначала поймите, что требуется: равновесие, эластичность, издержки, полезность или альтернативные издержки. Выпишите известные и искомое.'},
      {t:'Шаг 2. Выберите формулу', d:'Вспомните ключевую формулу из лекции. Например, для равновесия: Qd = Qs ⇒ a−bP = −c+dP. Для OC: ценность наилучшей отвергнутой альтернативы.'},
      {t:'Шаг 3. Подставьте числа', d:'Аккуратно подставьте параметры. Следите за единицами измерения. При необходимости решите уравнение относительно неизвестного.'},
      {t:'Шаг 4. Проверьте логику', d:'Имеет ли смысл полученный ответ? Положительный? В разумных границах? Соответствует ли знаку (эластичность обычно отрицательна)?'}
    ];
    const st = steps[SEM.guidedStep] || steps[0];
    let h = '<div class="card p-4 mb-3"><div class="font-extrabold text-[15px]"><i class="fa-solid fa-book-open-reader" style="color:var(--ac)"></i> Guided Practice · Тема '+m.id+'</div>'+
      '<div class="bar mt-2 mb-1"><div style="width:'+((SEM.guidedStep+1)/steps.length*100)+'%"></div></div>'+
      '<div class="text-[11px]" style="color:var(--mu)">Шаг '+(SEM.guidedStep+1)+' из '+steps.length+'</div></div>';
    h += '<div class="card p-4 mb-3"><div class="font-bold text-[14px] mb-2">'+st.t+'</div><div class="text-[13.5px] leading-relaxed" style="color:#dcdce4">'+st.d+'</div></div>';
    // Пример из первой задачи модуля

    h += '<div class="card p-4 mb-3"><div class="text-[14.5px] leading-relaxed mb-3" style="color:#dcdce4">'+t.q+'</div>';
    if(t.type==='num'){
      h += '<div class="flex gap-2 items-center"><input id="saCur" inputmode="decimal" placeholder="Ваш ответ" autofocus><span class="text-[12.5px] shrink-0" style="color:var(--mu)">'+(t.unit||'')+'</span></div>';

  if(SEM.stage === 'result'){
    const r = SEM.res;
    let h = '<div class="card p-5 text-center mb-3"><i class="fa-solid '+(r.pct>=80?'fa-trophy':'fa-triangle-exclamation')+' text-4xl mb-2" style="color:var(--ac)"></i>'+

      (r.pct>=80?'<div class="mt-2 font-bold" style="color:#22c55e">Семинар сдан! Тема '+(m.id<15?(m.id+1)+' разблокирована':'— курс завершён!')+'</div>'
        :'<div class="mt-2 font-bold" style="color:#ef4444">Порог 80% не достигнут. Разберите решения и попробуйте завтра (или купите попытку).</div>')+'</div>';
    // Показать разбор
    SEM.tasks.forEach((t,i)=>{
      const ans = SEM.answers[i];
      h += '<div class="card p-4 mb-2"><div class="flex items-center gap-2 mb-1"><span class="chip">Задача '+(i+1)+'</span>'+
        (ans&&ans.ok?'<span class="chip" style="color:#22c55e;border-color:#22c55e">верно</span>':'<span class="chip" style="color:#ef4444;border-color:#ef4444">ошибка</span>')+'</div>'+
        '<div class="text-[13px] mb-1">'+t.q+'</div>'+
        '<div class="note"><b>Решение:</b> '+t.sol+(t.type==='num'?' <br>Правильный ответ: <b>'+t.ans+'</b>':'')+'</div></div>';
    });
    h += '<button class="btn btn-p w-full mt-2" onclick="SEM.stage=\'intro\';render()">Вернуться к семинару</button>';

    return h;
  }
  return '<div class="card p-4">Загрузка...</div>';
}

function drPPF(){ const t=TR.ppf.tech, Y=100, x=Math.min(TR.ppf.x,t);
  const f=q=>Y*Math.sqrt(Math.max(0,1-Math.pow(q/t,2)));
  const y=f(x), mrt=(x<t)? (Y*Y*x)/(t*t*Math.max(y,0.001)) : 99;
  document.getElementById('g_ppf').innerHTML=plot({xmax:150,ymax:110,xlab:'Товар X',ylab:'Товар Y',
    series:[{pts:lin(f,t,50),c:'var(--p2)',lab:'КПВ'},{pts:[[0,Y*0.92],[t*0.92,0]],c:'var(--mu)',d:1,lab:'линейная'}],
    dots:[{x:x,y:y,lab:'A',c:'var(--ac)'}]});
  document.getElementById('o_ppf').innerHTML='Точка A: X = <b>'+x.toFixed(1)+'</b>, Y = <b>'+y.toFixed(1)+'</b>. Предельная норма трансформации MRT = |ΔY/ΔX| ≈ <b style="color:var(--ac)">'+mrt.toFixed(2)+'</b> ед. Y за ед. X. Выпуклость КПВ отражает <em>закон возрастающих альтернативных издержек</em>: каждая следующая единица X стоит всё больше Y.'; }
function drSD(){ const {a,b,c,d,t}=TR.sd; const Q=(a-c-t)/(b+d), Q0=(a-c)/(b+d);
  const Pd=a-b*Q, Ps=Pd-t, CS=.5*(a-Pd)*Q, PS=.5*(Ps-c)*Q, TX=t*Q, DWL=.5*t*(Q0-Q);
  document.getElementById('g_sd').innerHTML=plot({xmax:Math.max(20,Q0*1.4),ymax:Math.max(a*1.05,40),xlab:'Q',ylab:'P',
   areas:[{pts:[[0,a],[0,Pd],[Q,Pd]],c:'#3b9bff',o:.25},{pts:[[0,c],[0,Ps],[Q,Ps]],c:'#22c55e',o:.25}],
   series:[{pts:lin(q=>a-b*q,Math.max(20,Q0*1.4),30),c:'var(--p2)',lab:'D'},
           {pts:lin(q=>c+d*q,Math.max(20,Q0*1.4),30),c:'#22c55e',lab:'S'},
           t>0?{pts:lin(q=>c+d*q+t,Math.max(20,Q0*1.4),30),c:'var(--ac)',d:1,lab:'S+t'}:null].filter(Boolean),
   dots:[{x:Q,y:Pd,lab:'E',c:'var(--ac)'}]});
  document.getElementById('o_sd').innerHTML='Q* = <b>'+Q.toFixed(2)+'</b>; цена покупателя P<sub>d</sub> = <b>'+Pd.toFixed(2)+'</b>; цена продавца P<sub>s</sub> = <b>'+Ps.toFixed(2)+'</b>.<br>CS = '+CS.toFixed(1)+' · PS = '+PS.toFixed(1)+' · налоговые сборы = '+TX.toFixed(1)+' · <span style="color:#ef4444">DWL = '+DWL.toFixed(2)+'</span>. Доля налога на потребителе: <b>'+(t>0?(100*d/(b+d)).toFixed(0):'0')+'%</b> (тем больше, чем менее эластичен спрос).'; }
function drISO(){ const {w,r,C}=TR.iso; const L=C/(2*w), K=C/(2*r), Qst=Math.sqrt(L*K);
  const f=l=>(Qst*Qst)/Math.max(l,0.4);
  document.getElementById('g_iso').innerHTML=plot({xmax:Math.max(40,L*2.4),ymax:Math.max(40,K*2.4),xlab:'L (труд)',ylab:'K (капитал)',
   series:[{pts:lin(f,Math.max(40,L*2.4),60),c:'var(--p2)',lab:'Q = √(LK)'},
           {pts:[[0,C/r],[C/w,0]],c:'var(--ac)',lab:'изокоста'},
           {pts:lin(l=>(Qst*1.25*Qst*1.25)/Math.max(l,0.4),Math.max(40,L*2.4),60),c:'var(--mu)',d:1,lab:'Q↑'}],
   dots:[{x:L,y:K,lab:'E',c:'#22c55e'}]});
  document.getElementById('o_iso').innerHTML='Оптимум: L* = <b>'+L.toFixed(1)+'</b>, K* = <b>'+K.toFixed(1)+'</b>, выпуск Q = <b>'+Qst.toFixed(2)+'</b>. Условие: MRTS<sub>LK</sub> = MP<sub>L</sub>/MP<sub>K</sub> = K/L = w/r = <b style="color:var(--ac)">'+(w/r).toFixed(2)+'</b>. Удорожание труда поворачивает изокосту и смещает оптимум в сторону капитала (эффект замещения факторов).'; }
function drMON(){ const {a,b,c,d}=TR.mon; const Qm=(a-c)/(2*b+d), Pm=a-b*Qm, MCm=c+d*Qm;
  const Qc=(a-c)/(b+d), Pc=a-b*Qc, DWL=.5*(Qc-Qm)*(Pm-MCm), L=(Pm-MCm)/Pm;
  const xm=Math.max(20,Qc*1.35);
  document.getElementById('g_mon').innerHTML=plot({xmax:xm,ymax:a*1.05,xlab:'Q',ylab:'P',
   areas:[{pts:[[Qm,Pm],[Qc,Pc],[Qm,MCm]],c:'#ef4444',o:.35}],
   series:[{pts:lin(q=>a-b*q,xm,30),c:'var(--p2)',lab:'D'},{pts:lin(q=>a-2*b*q,xm,30),c:'#3b9bff',d:1,lab:'MR'},
           {pts:lin(q=>c+d*q,xm,30),c:'#22c55e',lab:'MC'}],
   dots:[{x:Qm,y:Pm,lab:'M',c:'var(--ac)'},{x:Qc,y:Pc,lab:'C',c:'#22c55e'}]});
  document.getElementById('o_mon').innerHTML='Монополия: Q<sub>m</sub> = <b>'+Qm.toFixed(2)+'</b>, P<sub>m</sub> = <b>'+Pm.toFixed(2)+'</b>, MC = '+MCm.toFixed(2)+'. Конкурентный выпуск Q<sub>c</sub> = '+Qc.toFixed(2)+' при P = '+Pc.toFixed(2)+'.<br>Индекс Лернера L = (P−MC)/P = <b style="color:var(--ac)">'+L.toFixed(3)+'</b> ⇒ |E<sub>d</sub>| = '+(1/Math.max(L,0.001)).toFixed(2)+'. Чистые потери общества <span style="color:#ef4444">DWL = '+DWL.toFixed(2)+'</span> (красный треугольник).'; }

  if(CALC==='eq') h+='<div class="text-[12px] mb-2" style="color:var(--mu)">Qd = a − b·P, Qs = −c + d·P</div>'+inp('c1','a','100')+inp('c2','b','2')+inp('c3','c','20')+inp('c4','d','3')+btn('calcEq');
  if(CALC==='cost') h+=inp('c1','FC (постоянные издержки)','200')+inp('c2','VC (переменные издержки)','400')+inp('c3','Q (выпуск)','50')+inp('c4','ΔTC при ΔQ=1 (для MC)','12')+btn('calcCost');
  if(CALC==='mr') h+='<div class="text-[12px] mb-2" style="color:var(--mu)">Спрос P = a − b·Q, издержки TC = F + cQ + dQ²</div>'+inp('c1','a','120')+inp('c2','b','2')+inp('c3','c (линейная часть MC)','20')+inp('c4','d (квадратичная часть)','0.5')+btn('calcMR');
  return h+'</div><div id="calcOut" class="note mt-2" style="display:none"></div>'; }
function inp(id,l,ph){ return '<div class="mb-2"><div class="text-[11.5px] mb-1" style="color:var(--mu)">'+l+'</div><input id="'+id+'" inputmode="decimal" placeholder="'+ph+'"></div>'; }
function btn(fn){ return '<button class="btn btn-p w-full mt-1" onclick="'+fn+'()"><i class="fa-solid fa-equals"></i> Рассчитать</button>'; }
function setCalc(c){ sClick(); CALC=c; render(); }
function gv(id){ return parseFloat((document.getElementById(id).value||'0').replace(',','.')); }
function out(h){ const o=document.getElementById('calcOut'); o.style.display='block'; o.innerHTML=h; sOk(); }
function calcEl(){ const p1=gv('c1'),q1=gv('c2'),p2=gv('c3'),q2=gv('c4');
  const pt=((q2-q1)/q1)/((p2-p1)/p1), arc=((q2-q1)/((q1+q2)/2))/((p2-p1)/((p1+p2)/2));
  const ch=Math.abs(arc)>1?'эластичный спрос':Math.abs(arc)===1?'единичная эластичность':'неэластичный спрос';
  out('<b>Точечная E<sub>p</sub></b> = '+pt.toFixed(3)+'<br><b>Дуговая (midpoint) E<sub>p</sub></b> = '+arc.toFixed(3)+'<br>Характер: <b style="color:var(--ac)">'+ch+'</b><br>Выручка при росте цены '+(Math.abs(arc)>1?'<span style="color:#ef4444">снизится</span>':'<span style="color:#22c55e">вырастет</span>')+'.'); }
function calcEq(){ const a=gv('c1'),b=gv('c2'),c=gv('c3'),d=gv('c4'); const P=(a+c)/(b+d),Q=a-b*P;
  out('P* = (a+c)/(b+d) = <b>'+P.toFixed(3)+'</b><br>Q* = <b>'+Q.toFixed(3)+'</b><br>Эластичность спроса в равновесии E<sub>d</sub> = −b·P/Q = <b>'+(-b*P/Q).toFixed(3)+'</b><br>Излишек потребителя CS = <b>'+(0.5*(a/b-P)*Q).toFixed(2)+'</b>'); }
function calcCost(){ const F=gv('c1'),V=gv('c2'),Q=gv('c3'),mc=gv('c4'); const TC=F+V;
  out('TC = <b>'+TC.toFixed(2)+'</b><br>AFC = '+(F/Q).toFixed(3)+' · AVC = '+(V/Q).toFixed(3)+' · ATC = <b>'+(TC/Q).toFixed(3)+'</b><br>MC ≈ <b>'+mc.toFixed(3)+'</b> ⇒ '+(mc<TC/Q?'MC < ATC: средние издержки <span style="color:#22c55e">убывают</span>':'MC > ATC: средние издержки <span style="color:#ef4444">растут</span>')); }
function calcMR(){ const a=gv('c1'),b=gv('c2'),c=gv('c3'),d=gv('c4');
  const Qm=(a-c)/(2*b+2*d),Pm=a-b*Qm,MC=c+2*d*Qm,Qc=(a-c)/(b+2*d);
  out('MR = a − 2bQ = '+a+' − '+(2*b)+'Q · MC = c + 2dQ = '+c+' + '+(2*d)+'Q<br>Оптимум монополиста: Q = <b>'+Qm.toFixed(3)+'</b>, P = <b>'+Pm.toFixed(3)+'</b>, MC = '+MC.toFixed(3)+
   '<br>Индекс Лернера = <b style="color:var(--ac)">'+((Pm-MC)/Pm).toFixed(3)+'</b><br>Конкурентный выпуск (P=MC): Q = '+Qc.toFixed(3)); }

   '<input id="rq" placeholder="Поиск по формулам и терминам..." value="'+RQ+'" oninput="RQ=this.value;renderRef()">'+
   '<div class="grid grid-cols-2 gap-2 mt-2"><button class="btn '+(RTAB==='f'?'btn-p':'btn-g')+' py-1.5 text-[12px]" onclick="RTAB=\'f\';sClick();render()">Формулы ('+FORMULAS.length+')</button>'+
   '<button class="btn '+(RTAB==='g'?'btn-p':'btn-g')+' py-1.5 text-[12px]" onclick="RTAB=\'g\';sClick();render()">Термины ('+GLOSSARY.length+')</button></div></div><div id="refList"></div>';
  setTimeout(renderRef,0); return h; }
function renderRef(){ const q=RQ.toLowerCase(); let h='';
  if(RTAB==='f') h=FORMULAS.filter(f=>(f[0]+f[1]+f[2]).toLowerCase().includes(q)).map(f=>
    '<div class="card p-3.5 mb-2"><div class="font-bold text-[13.5px]">'+f[0]+'</div><div class="fml">'+f[1]+'</div><div class="text-[12.5px]" style="color:var(--mu)">'+f[2]+'</div></div>').join('');
  else h=GLOSSARY.filter(g=>(g[0]+g[1]).toLowerCase().includes(q)).map(g=>
    '<div class="card p-3.5 mb-2"><div class="font-bold text-[13.5px]" style="color:var(--ac)">'+g[0]+'</div><div class="text-[13px] mt-1" style="color:#d8d8e0;line-height:1.6">'+g[1]+'</div></div>').join('');
  const el=document.getElementById('refList'); if(el) el.innerHTML=h||'<div class="card p-4 text-center text-[13px]" style="color:var(--mu)">Ничего не найдено</div>'; }

 '<button class="btn btn-p w-full" style="background:#dc2626" onclick="doReset()">Да, сбросить</button><button class="btn btn-g w-full mt-2" onclick="closeModal()">Отмена</button>'); }
